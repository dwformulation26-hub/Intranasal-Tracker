<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intranasal Pipeline Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Same system as Presbyopia Pipeline Radar: page 1 = stage lanes of product cards, page 2 = endpoint brief, page 3 = dated news list */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --ink: #121819; --ink-2: #48534f; --muted: #7b8582; --line: #dde2e0; --line-2: #c9d0cd;
  --accent: #0e6a78; --accent-soft: #e1eff0; --accent-ink: #0b5560;
  --ok: #1d7f47; --ok-soft: #e3f3e8; --warn: #9a6512; --warn-soft: #fbf0dc; --crit: #b23a30; --crit-soft: #fbe7e4;
  --lane-1: #0b5560; --lane-2: #0e6a78; --lane-3: #3b8b96; --lane-4: #6aa9b1; --lane-5: #9cc6cb; --lane-6: #b9bfbd;
  --sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1213; --surface: #161c1d; --ink: #e7eeec; --ink-2: #b2bebb; --muted: #7e8a87; --line: #252e2f; --line-2: #34403f;
    --accent: #5bb6c3; --accent-soft: #15333a; --accent-ink: #8fd0d9;
    --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
    --lane-1: #8fd0d9; --lane-2: #5bb6c3; --lane-3: #3f97a3; --lane-4: #2f7781; --lane-5: #255b62; --lane-6: #4a5452;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1213; --surface: #161c1d; --ink: #e7eeec; --ink-2: #b2bebb; --muted: #7e8a87; --line: #252e2f; --line-2: #34403f;
  --accent: #5bb6c3; --accent-soft: #15333a; --accent-ink: #8fd0d9;
  --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
  --lane-1: #8fd0d9; --lane-2: #5bb6c3; --lane-3: #3f97a3; --lane-4: #2f7781; --lane-5: #255b62; --lane-6: #4a5452;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.ko { display: block; color: var(--ink-2); font-size: .94em; }
.ko-inline { color: var(--ink-2); margin-left: .4em; font-weight: 400; }
:root[data-lang="en"] .ko, :root[data-lang="en"] .ko-inline { display: none; }
:root[data-lang="ko"] .en { display: none; }
:root[data-lang="ko"] .ko { color: inherit; font-size: inherit; }
:root[data-lang="ko"] .ko-inline { color: inherit; margin-left: 0; }
:root[data-lang="ko"] body, :root[data-lang="both"] body { word-break: keep-all; }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 18px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.name { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; margin-right: auto; }
.name svg { width: 22px; height: 22px; flex: none; }
.name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
nav { display: flex; gap: 2px; }
nav a { display: flex; align-items: baseline; gap: 6px; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); font-size: 14px; white-space: nowrap; }
nav a b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); }
nav a:hover { background: var(--bg); text-decoration: none; }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
nav a[aria-current="page"] b { color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[aria-pressed="true"] .ko-inline { color: inherit; }
@media (max-width: 760px) { nav { order: 3; width: 100%; overflow-x: auto; } nav a { padding: 7px 10px; } .top-in { gap: 8px 12px; } .name { min-width: 0; } }

main { padding-block: 32px 56px; }
h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 650; text-wrap: balance; }
h1 .ko { font-size: .62em; font-weight: 500; margin-top: 6px; letter-spacing: 0; }
:root[data-lang="ko"] h1 .ko { font-size: 1em; font-weight: 650; margin-top: 0; }
h2 { font-size: 18px; letter-spacing: -.01em; margin: 0; font-weight: 650; }
h2 .ko-inline { font-size: .85em; }
h3 { margin: 0; }
.lede { color: var(--ink-2); max-width: 72ch; margin: 12px 0 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: .02em; }
.stack { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .lane > * { min-width: 0; }

/* page 1: stage strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 22px; }
.strip a { display: grid; gap: 2px; padding: 10px 12px 9px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; color: var(--ink); }
.strip a:hover { text-decoration: none; border-color: var(--line-2); border-top-color: var(--c); }
.strip .n { font-size: 24px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.strip .l { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.sel { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* area × stage matrix */
.mx-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
.mx th, .mx td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.mx th:first-child, .mx td:first-child { text-align: left; }
.mx thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
.mx thead th .ko { font-weight: 500; font-size: 11px; }
.mx tbody tr:last-child td { border-bottom: 0; }
.mx td.c button { font: 600 13px var(--mono); border: 0; background: none; color: var(--ink); cursor: pointer; padding: 2px 8px; border-radius: 6px; min-width: 32px; }
.mx td.c button:hover { background: var(--accent-soft); color: var(--accent-ink); }
.mx td.z { color: var(--line-2); font-family: var(--mono); }
.mx td.tot { font-family: var(--mono); color: var(--muted); }
.mx tr.on td { background: var(--accent-soft); }

.lane { display: grid; gap: 12px; scroll-margin-top: 90px; grid-template-columns: minmax(0, 1fr); }
.lane-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--c); padding-bottom: 8px; }
.lane-h .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.card-h { display: flex; gap: 10px; min-width: 0; align-items: flex-start; justify-content: space-between; }
.card-h > div { min-width: 0; }
.co { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.co .ko { font-size: 12.5px; color: var(--muted); }
.prod { font-size: 17px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; margin: 2px 0 0; }
.prod .ko { font-size: 14px; font-weight: 500; margin-top: 1px; }
:root[data-lang="ko"] .co .ko { font-size: inherit; color: inherit; }
:root[data-lang="ko"] .prod .ko { font-size: inherit; font-weight: inherit; }
.api { font-size: 13px; color: var(--muted); line-height: 1.45; }
.flag { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); flex: none; }
.flag.kr { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); line-height: 1.5; }
.area { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); line-height: 1.5; }
.fresh { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); line-height: 1.5; }
.fresh.new { background: var(--ok-soft); color: var(--ok); }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; line-height: 1.3; }
.lbl .ko { display: block; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; }
:root[data-lang="ko"] .lbl .ko { font-size: 12px; }
.now { color: var(--ink); }
.when { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.trials { display: grid; gap: 6px; min-width: 0; }
.trial { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--ink-2); }
.trial a { font-family: var(--mono); font-size: 12px; }
.trial .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.st { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.st.done { background: var(--bg); color: var(--ink-2); }
.st.go { background: var(--ok-soft); color: var(--ok); }
.st.stop { background: var(--crit-soft); color: var(--crit); }
.st.unk { background: var(--warn-soft); color: var(--warn); }
.res { color: var(--ok); font-weight: 700; }
.dev { color: var(--ink-2); }
.srcl { font-size: 12px; }
.stopped > summary { cursor: pointer; list-style: none; }
.stopped > summary::-webkit-details-marker { display: none; }
.stopped .lane-h::after { content: "+"; font-family: var(--mono); color: var(--muted); }
.stopped[open] .lane-h::after { content: "–"; }
.stopped[open] .cards { margin-top: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 20px; color: var(--muted); text-align: center; }

/* page 2 */
.formula { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 16px; }
.terms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.term { padding: 14px; border-right: 1px solid var(--line-2); display: grid; gap: 4px; align-content: start; min-width: 0; }
.term:last-child { border-right: 0; }
.term .k { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; }
.term .v { font-weight: 600; font-size: 15px; line-height: 1.35; }
.term .d { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 860px) { .terms { grid-template-columns: minmax(0, 1fr); } .term { border-right: 0; border-bottom: 1px solid var(--line-2); } .term:last-child { border-bottom: 0; } }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: bottom; }
th .ko { font-weight: 500; font-size: 11px; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
/* endpoint category: header, the category's standard endpoint, then one short row per product */
.ep { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: 90px; }
.ep-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 16px 18px 12px; }
.ep-h .route { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.ep-h .cnt { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.std { display: grid; grid-template-columns: 1.5fr 1.2fr 1fr; background: var(--accent-soft); border-block: 1px solid var(--line); }
.std > div { padding: 10px 18px; display: grid; gap: 2px; min-width: 0; }
.std > div + div { border-left: 1px solid var(--line-2); }
.std .k, .ep-head > div, .ep-row > div::before { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.std .k { color: var(--accent-ink); }
.std .v { font-weight: 600; font-size: 14px; line-height: 1.35; }
.std .v .ko { font-weight: 500; font-size: 12.5px; }
.ep-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1.1fr) minmax(0, .8fr) minmax(0, 1.15fr);
  gap: 4px 16px; padding: 10px 18px; font-size: 13px; line-height: 1.4; align-items: start; }
.ep-head { padding-block: 9px 7px; border-bottom: 1px solid var(--line); }
/* in EN·KR mode, tiny labels show English only (KR mode still shows Korean); full text keeps both languages */
:root[data-lang="both"] :is(.ep-head, .std .k, .ep-h .cnt, .ep-h .route, .c-prod .sub, details.more summary, .jump a, .agency, .status, .seen) .ko-inline { display: none; }
.ep-item { border-bottom: 1px solid var(--line); }
.ep-item:last-of-type { border-bottom: 0; }
.ep-row .ko { font-size: 12px; }
.c-prod b { font-size: 14px; }
.c-prod .sub { display: block; color: var(--muted); font-size: 12px; }
.c-res { color: var(--accent-ink); font-weight: 600; }
.c-res .ko { font-weight: 500; }
.c-none { color: var(--line-2); }
.ep details.more { padding: 0 18px 10px; margin-top: -4px; }
.ep details.more summary { cursor: pointer; font-size: 12px; color: var(--accent-ink); width: max-content; list-style: none; }
.ep details.more summary::-webkit-details-marker { display: none; }
.ep details.more summary::before { content: "+ "; font-family: var(--mono); }
.ep details.more[open] summary::before { content: "– "; }
.ep details.more .body { margin-top: 6px; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 6px; }
.ep details.more .ncts { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 11.5px; }
.take { margin: 0; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.take b { color: var(--ink); }
@media (max-width: 900px) {
  .std { grid-template-columns: minmax(0, 1fr); }
  .std > div + div { border-left: 0; border-top: 1px solid var(--line-2); }
  .ep-head { display: none; }
  .ep-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
  .ep-row > .c-prod { grid-column: 1 / -1; }
  .ep-row > div[data-l]::before { content: attr(data-l); display: block; margin-bottom: 1px; }
}
/* guidance: one line per document */
.gd { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.gd-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.gd-row:last-child { border-bottom: 0; }
.agency { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
.gd-row .t { font-weight: 600; font-size: 13.5px; }
.gd-row .w { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-top: 1px; }
.gd-row .w .ko { font-size: 12px; }
.status { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
.status.final { background: var(--ok-soft); color: var(--ok); }
.status.draft { background: var(--warn-soft); color: var(--warn); }
.gd-row .yr { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
@media (max-width: 600px) { .gd-row { grid-template-columns: minmax(0, 1fr); } }
/* nasal-specific tests as tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 215px), 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.tile b { font-size: 14px; }
.tile .w { font-size: 12.5px; color: var(--ink-2); }
.tile .seen { margin-top: 4px; font-size: 11.5px; color: var(--accent-ink); }
.tile .seen::before { content: "Seen in · "; color: var(--muted); }
:root[data-lang="ko"] .tile .seen::before { content: "사례 · "; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.jump a { font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-2); background: var(--surface); }
.jump a:hover { text-decoration: none; border-color: var(--accent); color: var(--accent-ink); }
.bul { margin: 0; padding: 0; display: grid; gap: 8px; }
.bul li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
.todo { display: grid; gap: 10px; counter-reset: todo; }
.todo li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px 52px; position: relative; }
.todo li::before { counter-increment: todo; content: counter(todo); position: absolute; left: 16px; top: 13px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: var(--surface); font: 600 12.5px/24px var(--mono); text-align: center; }
.todo b { display: block; }
.todo .why { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.section-h { display: grid; gap: 4px; margin-bottom: 12px; }
.section-h p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 72ch; }
.cat .section-h { margin-bottom: 0; scroll-margin-top: 90px; }

/* page 3 */
.news { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.month { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 14px 16px 6px; background: var(--bg); border-top: 1px solid var(--line); }
.month:first-child { border-top: 0; }
.item { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
.month + .item { border-top: 0; }
.item .d { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.item .t { min-width: 0; }
.item .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 3px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--bg); color: var(--ink-2); }
.tag.kr { background: var(--accent-soft); color: var(--accent-ink); }
.tag.dv { background: var(--warn-soft); color: var(--warn); }
.item .s { font-size: 12.5px; white-space: nowrap; padding-top: 2px; }
@media (max-width: 600px) { .item { grid-template-columns: 1fr; } .item .s { white-space: normal; } }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-block: 18px 28px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="name">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.4 4.3 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.6-6.7 6-11z" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="14" r="2.6" fill="var(--accent)"/></svg>
      <div>Intranasal Pipeline Radar<small id="asof"></small></div>
    </div>
    <nav aria-label="Pages">
      <a href="#competitors" data-page="competitors"><b>1</b><span><span class="en">Competitors</span><span class="ko-inline">경쟁사</span></span></a>
      <a href="#endpoints" data-page="endpoints"><b>2</b><span><span class="en">Endpoints</span><span class="ko-inline">평가변수</span></span></a>
      <a href="#news" data-page="news"><b>3</b><span><span class="en">News</span><span class="ko-inline">뉴스</span></span></a>
    </nav>
    <div class="seg" id="lang" role="group" aria-label="Language">
      <button type="button" data-l="both">EN·KR</button><button type="button" data-l="en">EN</button><button type="button" data-l="ko">KR</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="p-competitors" class="stack"></section>
  <section id="p-endpoints" class="stack" hidden></section>
  <section id="p-news" class="stack" hidden></section>
</main>
<footer class="wrap foot" id="foot"></footer>

<script>window.NASAL = /*DATA*/null;</script>
<script>
"use strict";
const D = window.NASAL;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// bilingual text: block (two lines) or inline
const T = (o) => (o && typeof o === "object" ? `<span class="en">${o.en}</span>${o.ko && o.ko !== o.en ? `<span class="ko">${o.ko}</span>` : ""}` : o ?? "");
const Ti = (en, ko) => `<span class="en">${en}</span><span class="ko-inline">${ko}</span>`;
const name = (o) => (o.ko && o.ko !== o.en ? `<span class="en">${o.en}</span><span class="ko-inline">${o.ko}</span>` : o.en);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const segHtml = (id, cur, opts) => `<div class="seg" id="${id}" role="group">${opts.map(([v, en, ko]) =>
  `<button type="button" data-v="${v}" aria-pressed="${cur === v}">${Ti(en, ko)}</button>`).join("")}</div>`;

// ── language ────────────────────────────────────────────────────
function setLang(l) {
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l === "ko" ? "ko" : "en";
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
  try { localStorage.setItem("nasal-lang", l); } catch (e) { /* storage unavailable */ }
}
let saved = null; try { saved = localStorage.getItem("nasal-lang"); } catch (e) { /* storage unavailable */ }
setLang(["both", "en", "ko"].includes(saved) ? saved : "both");
$("#lang").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); });
$("#asof").innerHTML = `<span class="en">Data as of </span>${D.asOf}<span class="ko-inline">기준</span>`;

// ═════════ PAGE 1 — COMPETITORS ═════════
const LANE_C = { market: "--lane-1", review: "--lane-2", p3: "--lane-3", p2: "--lane-4", early: "--lane-5", stopped: "--lane-6" };
const ST = {
  COMPLETED: ["done", "Completed", "완료"], RECRUITING: ["go", "Recruiting", "모집 중"], ACTIVE_NOT_RECRUITING: ["go", "Active", "진행 중"],
  NOT_YET_RECRUITING: ["go", "Not yet recruiting", "모집 전"], ENROLLING_BY_INVITATION: ["go", "Enrolling by invitation", "초청 모집"],
  TERMINATED: ["stop", "Terminated", "조기 종료"], WITHDRAWN: ["stop", "Withdrawn", "철회"], SUSPENDED: ["stop", "Suspended", "일시 중지"],
  UNKNOWN: ["unk", "Status unknown", "상태 불명"],
};
let scope = "All", area = "All";

function trialHtml(c) {
  if (!c.trials.length) return `<span class="muted">${T(c.noTrial) || Ti("No registered trial found", "등록 임상 확인 안 됨")}</span>`;
  const shown = c.trials.slice(0, 3);
  return shown.map((t) => {
    const [cls, en, ko] = ST[t.status] || ["unk", t.status, t.status];
    const tip = `${t.phase || ""} · n=${t.n ?? "?"} · primary completion ${t.pcd || "?"} · updated ${t.updated || "?"}`;
    return `<div class="trial" title="${esc(tip)}"><a href="https://clinicaltrials.gov/study/${t.nct}" target="_blank" rel="noopener">${t.nct}</a>
      <span class="st ${cls}">${Ti(en, ko)}</span><span class="meta">${t.phase || ""} · n=${t.n ?? "?"}${t.pcd ? " · " + String(t.pcd).slice(0, 7) : ""}</span>${t.results ? `<span class="res" title="Results posted">✓</span>` : ""}</div>`;
  }).join("") + (c.noTrial ? `<div class="muted" style="font-size:12px">${T(c.noTrial)}</div>` : "");
}

// "New" for cards added in the last 30 days, "Updated" for a card change in the last 14 days (weekly routine writes these)
const daysAgo = (d) => (new Date(D.asOf) - new Date(d)) / 864e5;
function badge(c) {
  if (c.added && daysAgo(c.added) <= 30) return `<span class="fresh new">${Ti("New", "신규")}</span>`;
  const last = (c.history || []).map((h) => h.date).sort().pop();
  return last && daysAgo(last) <= 14 ? `<span class="fresh">${Ti("Updated", "업데이트")}</span>` : "";
}

function card(c) {
  const ar = D.areas.find((a) => a.id === c.area) || { en: c.area, ko: c.area };
  return `<article class="card">
    <div class="card-h"><div><div class="co">${T(c.company)}</div><h3 class="prod">${T(c.product)}</h3></div>
      <span class="flag${c.region === "KR" ? " kr" : ""}" title="${esc(c.region)}">${esc(c.region)}</span></div>
    <div class="api">${T(c.api)}</div>
    <div class="pills"><span class="stage">${Ti(c.stage.en, c.stage.ko)}</span><span class="area">${Ti(ar.en, ar.ko)}</span>${badge(c)}</div>
    <div class="row"><div class="lbl">${T({ en: "For", ko: "적응증" })}</div><div>${T(c.indication)}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Now", ko: "현황" })}</div><div class="now">${T(c.now)}${c.src ? ` <a class="srcl" href="${esc(c.src.url)}" target="_blank" rel="noopener" title="${esc(c.src.label)}">↗</a>` : ""}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Device", ko: "디바이스" })}</div><div class="dev">${T(c.device)}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Trials", ko: "임상" })}</div><div class="trials">${trialHtml(c)}</div></div>
  </article>`;
}

const inScope = (c) => scope === "All" || (scope === "Korea" ? c.region === "KR" : c.region !== "KR");
function renderCompetitors() {
  const el = $("#p-competitors");
  const pool = D.cards.filter(inScope);
  const cards = pool.filter((c) => area === "All" || c.area === area);
  // newest move first; Korean assets first on a tie
  const sorted = (l) => cards.filter((c) => c.lane === l).sort((a, b) => (b.lastMove || "").localeCompare(a.lastMove || "") || (a.region === "KR" ? -1 : 0) - (b.region === "KR" ? -1 : 0));
  const cnt = (ar, l) => pool.filter((c) => c.area === ar && c.lane === l).length;
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 1 · Competitors by development stage", "1페이지 · 개발 단계별 경쟁사")}</div>
      <h1>${T({ en: "Where every nasal product stands now", ko: "비강 제품별 현재 개발 현황" })}</h1>
      <p class="lede">${T({ en: `${D.cards.length} intranasal products across all disease areas (sprays, powders, gels, implants and vaccines), grouped by their most advanced stage. Each card shows the latest move, the delivery device and the trial record on ClinicalTrials.gov.`,
        ko: `질환군과 관계없이 비강 투여 제품 ${D.cards.length}개(스프레이·분말·겔·임플란트·백신)를 최고 개발 단계별로 정리했습니다. 각 카드에 최근 동향, 투여 디바이스, ClinicalTrials.gov 임상 기록을 표시합니다.` })}</p>
      <div class="strip">${D.lanes.map((l) => `<a href="#lane-${l.id}" style="--c:var(${LANE_C[l.id]})"><span class="n">${sorted(l.id).length}</span><span class="l">${T(l.name)}</span></a>`).join("")}</div>
      <div class="mx-wrap"><table class="mx"><thead><tr><th>${T({ en: "Disease area", ko: "질환군" })}</th>${D.lanes.map((l) => `<th>${T(l.name)}</th>`).join("")}<th>${T({ en: "Total", ko: "합계" })}</th></tr></thead><tbody>
        ${D.areas.map((a) => {
          const tot = pool.filter((c) => c.area === a.id).length;
          if (!tot) return "";
          return `<tr class="${area === a.id ? "on" : ""}"><td><button type="button" class="arbtn" data-a="${esc(a.id)}" style="all:unset;cursor:pointer">${Ti(a.en, a.ko)}</button></td>${D.lanes.map((l) => {
            const n = cnt(a.id, l.id);
            return n ? `<td class="c"><button type="button" data-a="${esc(a.id)}" data-l="${l.id}" title="${esc(a.en)} · ${esc(l.name.en)}">${n}</button></td>` : `<td class="z">·</td>`;
          }).join("")}<td class="tot">${tot}</td></tr>`;
        }).join("")}
      </tbody></table></div>
      <div class="toolbar">
        <div class="tools">
          ${segHtml("scope", scope, [["All", "All", "전체"], ["Korea", "Korea", "국내"], ["Global", "Global", "글로벌"]])}
          <select class="sel" id="areaSel" aria-label="Disease area">
            <option value="All">All disease areas · 전체 질환군</option>
            ${D.areas.map((a) => `<option value="${esc(a.id)}"${area === a.id ? " selected" : ""}>${esc(a.en)} · ${esc(a.ko)}</option>`).join("")}
          </select>
        </div>
        <div class="legend"><span>${Ti("Within each stage: most recent move first", "단계 내 정렬: 최근 동향 순")}</span></div>
      </div>
    </div>
    ${D.lanes.map((l) => {
      const list = sorted(l.id);
      const head = `<div class="lane-h"><h2>${Ti(l.name.en, l.name.ko)}</h2><span class="count">${list.length}</span></div>`;
      const body = list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<div class="empty">${Ti("Nothing at this stage for the current filter", "현재 필터에 해당하는 제품 없음")}</div>`;
      return l.id === "stopped"
        ? `<details class="lane stopped" id="lane-${l.id}" style="--c:var(${LANE_C[l.id]})"><summary>${head}</summary>${body}</details>`
        : `<div class="lane" id="lane-${l.id}" style="--c:var(${LANE_C[l.id]})">${head}${body}</div>`;
    }).join("")}`;
  $("#scope", el).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { scope = b.dataset.v; renderCompetitors(); } });
  $("#areaSel", el).addEventListener("change", (e) => { area = e.target.value; renderCompetitors(); });
  $(".mx", el).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    area = area === b.dataset.a && !b.dataset.l ? "All" : b.dataset.a;
    renderCompetitors();
    const target = b.dataset.l ? document.getElementById(`lane-${b.dataset.l}`) : null;
    if (target) { if (target.tagName === "DETAILS") target.open = true; target.scrollIntoView(); }
  });
}

// ═════════ PAGE 2 — ENDPOINTS ═════════
const STATUS_KO = { Final: "최종", Draft: "초안", Database: "데이터베이스", Presentation: "발표자료", Template: "템플릿" };
const COLS = [["Design", "설계"], ["Primary endpoint", "1차 평가변수"], ["Compared with", "대조"], ["When", "시점"], ["Key result", "주요 결과"]];
const cell = (v, [en, ko], cls = "") => `<div class="${cls}" data-l="${en} · ${ko}">${v ? T(v) : `<span class="c-none">·</span>`}</div>`;
function epSection(c) {
  return `<section class="ep" id="cat-${c.key}">
    <div class="ep-h"><h2>${Ti(c.name.en, c.name.ko)}</h2><span class="route">${Ti(c.route.en, c.route.ko)}</span>
      <span class="cnt">${Ti(`${c.products.length} product${c.products.length > 1 ? "s" : ""}`, `${c.products.length}개 제품`)}</span></div>
    <div class="std">
      <div><span class="k">${Ti("Standard primary endpoint", "표준 1차 평가변수")}</span><span class="v">${T(c.std.primary)}</span></div>
      <div><span class="k">${Ti("Compared with", "대조")}</span><span class="v">${T(c.std.vs)}</span></div>
      <div><span class="k">${Ti("Timepoint", "평가 시점")}</span><span class="v">${T(c.std.when)}</span></div>
    </div>
    <div class="ep-row ep-head"><div>${Ti("Product", "제품")}</div>${COLS.map(([en, ko]) => `<div>${Ti(en, ko)}</div>`).join("")}</div>
    ${c.products.map((p) => `<div class="ep-item">
      <div class="ep-row">
        <div class="c-prod"><b>${esc(p.name)}</b><span class="sub">${Ti(p.sub.en, p.sub.ko)}</span></div>
        ${cell(p.design, COLS[0])}${cell(p.primary, COLS[1])}${cell(p.vs, COLS[2])}${cell(p.when, COLS[3])}${cell(p.result, COLS[4], "c-res")}
      </div>
      <details class="more"><summary>${Ti("Details", "상세")}${p.ncts.length ? ` · ${p.ncts.length} NCT` : ""}</summary>
        <div class="body"><div>${T(p.more)}</div>${p.ncts.length ? `<div class="ncts">${p.ncts.map((n) => `<a href="https://clinicaltrials.gov/study/${n}" target="_blank" rel="noopener">${n}</a>`).join("")}</div>` : ""}</div>
      </details></div>`).join("")}
    <p class="take"><b>${Ti("For a new nasal entrant:", "신규 진입자 시사점:")}</b> ${T(c.takeaway)}</p>
  </section>`;
}

function renderEndpoints() {
  const el = $("#p-endpoints");
  const E = D.endpoints;
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 2 · Efficacy, PK and PD endpoints", "2페이지 · 유효성·PK·PD 평가변수")}</div>
      <h1>${T(E.title)}</h1>
      <p class="lede">${T(E.lede)}</p>
      <div class="jump">${E.categories.map((c) => `<a href="#cat-${c.key}" data-jump="cat-${c.key}">${Ti(c.name.en, c.name.ko)}</a>`).join("")}</div>
    </div>
    <div class="formula">
      <div class="section-h"><h2>${Ti("Two routes to approval", "허가로 가는 두 가지 경로")}</h2></div>
      <div class="terms">${E.routes.map((r) => `<div class="term"><span class="k">${Ti(r.k.en, r.k.ko)}</span><span class="v">${T(r.v)}</span><span class="d">${T(r.d)}</span></div>`).join("")}</div>
    </div>
    ${E.categories.map(epSection).join("")}
    <div>
      <div class="section-h"><h2>${Ti("Nasal-specific safety and device tests", "비강 제형 고유의 안전성·디바이스 시험")}</h2>
        <p>${T({ en: "Measured in almost every nasal program on top of the efficacy endpoint.", ko: "유효성 평가변수와 별도로 거의 모든 비강 개발에서 측정합니다." })}</p></div>
      <div class="tiles">${E.localSafety.map((s) => `<div class="tile"><b>${Ti(s.name.en, s.name.ko)}</b><span class="w">${T(s.what)}</span><span class="seen">${Ti(s.seen.en, s.seen.ko)}</span></div>`).join("")}</div>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("Guidance documents", "가이드라인")}</h2></div>
      <div class="gd">${E.guidance.map((g) => `<div class="gd-row"><span class="agency">${esc(g.agency)}</span>
        <span><a class="t" href="${esc(g.url)}" target="_blank" rel="noopener">${Ti(g.title.en, g.title.ko)}</a><span class="w">${T(g.why)}</span></span>
        <span><span class="status ${g.status.toLowerCase()}">${Ti(g.status, STATUS_KO[g.status] || g.status)}</span><span class="yr">${esc(g.year)}</span></span></div>`).join("")}</div>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("What we should do next", "향후 우리가 할 일")}</h2></div>
      <ol class="todo" style="padding:0;margin:0">${E.todo.map((t) => `<li><b>${T(t.h)}</b><div class="why">${T(t.why)}</div></li>`).join("")}</ol>
    </div>`;
  el.querySelector(".jump").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-jump]"); if (!a) return;
    e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView();
  });
}

// ═════════ PAGE 3 — NEWS ═════════
let nscope = "All", ntype = "All";
const TYPE = { Approval: ["Approval", "승인"], Filing: ["Filing", "허가 신청"], Deal: ["Deal", "계약"], Launch: ["Launch", "출시"], Trial: ["Trial", "임상"],
  Corporate: ["Corporate", "기업"], Device: ["Delivery system", "전달 시스템"], Regulatory: ["Regulatory", "규제"] };
function renderNews() {
  const el = $("#p-news");
  const list = D.news.filter((n) => (nscope === "All" || (nscope === "Korea" ? n.region === "KR" : n.region !== "KR")) && (ntype === "All" || n.type === ntype));
  let html = "", last = "";
  list.forEach((n) => {
    const [y, m] = n.date.split("-");
    const key = `${y}-${m || ""}`;
    if (key !== last) { html += `<div class="month">${m ? Ti(`${MONTHS[+m - 1]} ${y}`, `${y}년 ${+m}월`) : y}</div>`; last = key; }
    const ty = TYPE[n.type] || [n.type, n.type];
    html += `<div class="item"><div class="d">${n.date}</div><div class="t"><div class="tags"><span class="tag${n.region === "KR" ? " kr" : ""}">${n.region === "KR" ? Ti("Korea", "국내") : Ti("Global", "글로벌")}</span><span class="tag${n.type === "Device" ? " dv" : ""}">${Ti(ty[0], ty[1])}</span></div>${T(n.text)}</div>
      <div class="s">${n.src ? `<a href="${esc(n.src.url)}" target="_blank" rel="noopener" title="${esc(n.src.label)}">${Ti("Source", "출처")} ↗</a>` : ""}</div></div>`;
  });
  const types = Object.keys(TYPE).filter((k) => D.news.some((n) => n.type === k));
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 3 · News", "3페이지 · 뉴스")}</div>
      <h1>${T({ en: "Intranasal products and delivery-system news", ko: "비강 제품 및 전달 시스템 뉴스" })}</h1>
      <p class="lede">${T({ en: `${D.news.length} dated events since Jan 2025, newest first, one sentence each. "Delivery system" marks device, platform and nasal-specific regulatory news.`,
        ko: `2025년 1월 이후 날짜별 이벤트 ${D.news.length}건, 최신순, 한 문장 요약. '전달 시스템'은 디바이스·플랫폼·비강 관련 규제 뉴스입니다.` })}</p>
      <div class="toolbar"><div class="tools">${segHtml("nscope", nscope, [["All", "All", "전체"], ["Korea", "Korea", "국내"], ["Global", "Global", "글로벌"]])}
        <select class="sel" id="ntype" aria-label="News type"><option value="All">All types · 전체 유형</option>${types.map((k) => `<option value="${k}"${ntype === k ? " selected" : ""}>${TYPE[k][0]} · ${TYPE[k][1]}</option>`).join("")}</select></div>
        <div class="legend"><span>${list.length} / ${D.news.length}</span></div></div>
    </div>
    <div class="news">${html || `<div class="empty" style="border:0">${Ti("No news for this filter", "해당 뉴스 없음")}</div>`}</div>`;
  $("#nscope", el).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { nscope = b.dataset.v; renderNews(); } });
  $("#ntype", el).addEventListener("change", (e) => { ntype = e.target.value; renderNews(); });
}

// ═════════ ROUTER ═════════
const PAGES = { competitors: renderCompetitors, endpoints: renderEndpoints, news: renderNews };
const done = {};
function show() {
  const h = location.hash.slice(1);
  const page = PAGES[h] ? h : "competitors";
  Object.keys(PAGES).forEach((p) => ($(`#p-${p}`).hidden = p !== page));
  document.querySelectorAll("nav a").forEach((a) => (a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  if (!done[page]) { PAGES[page](); done[page] = true; }
}
addEventListener("hashchange", () => { const h = location.hash.slice(1); show(); if (PAGES[h]) scrollTo({ top: 0 }); });
show();
$("#foot").innerHTML = T({ en: "Sources: ClinicalTrials.gov API, FDA labels and reviews, company filings and trade press. Research current to " + D.asOf + ". Internal use only.",
  ko: "출처: ClinicalTrials.gov API, FDA 라벨 및 심사 자료, 기업 공시 및 업계 언론. " + D.asOf + " 기준 조사. 내부용 자료." });
</script>
