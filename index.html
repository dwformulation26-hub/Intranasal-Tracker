<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intranasal Pipeline Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Same system as Presbyopia Pipeline Radar: page 1 = stage lanes of product cards, page 2 = endpoint brief, page 3 = dated news list */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --ink: #121819; --ink-2: #48534f; --muted: #7b8582; --line: #dde2e0; --line-2: #c9d0cd;
  --accent: #0e6a78; --accent-soft: #e1eff0; --accent-ink: #0b5560;
  --ok: #1d7f47; --ok-soft: #e3f3e8; --warn: #9a6512; --warn-soft: #fbf0dc; --crit: #b23a30; --crit-soft: #fbe7e4;
  --lane-1: #0b5560; --lane-2: #0e6a78; --lane-3: #3b8b96; --lane-4: #6aa9b1; --lane-5: #9cc6cb; --lane-6: #b9bfbd;
  --sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1213; --surface: #161c1d; --ink: #e7eeec; --ink-2: #b2bebb; --muted: #7e8a87; --line: #252e2f; --line-2: #34403f;
    --accent: #5bb6c3; --accent-soft: #15333a; --accent-ink: #8fd0d9;
    --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
    --lane-1: #8fd0d9; --lane-2: #5bb6c3; --lane-3: #3f97a3; --lane-4: #2f7781; --lane-5: #255b62; --lane-6: #4a5452;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1213; --surface: #161c1d; --ink: #e7eeec; --ink-2: #b2bebb; --muted: #7e8a87; --line: #252e2f; --line-2: #34403f;
  --accent: #5bb6c3; --accent-soft: #15333a; --accent-ink: #8fd0d9;
  --ok: #4cc27f; --ok-soft: #143222; --warn: #e2a64a; --warn-soft: #33270f; --crit: #ef7a6e; --crit-soft: #3a1c19;
  --lane-1: #8fd0d9; --lane-2: #5bb6c3; --lane-3: #3f97a3; --lane-4: #2f7781; --lane-5: #255b62; --lane-6: #4a5452;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.ko { display: block; color: var(--ink-2); font-size: .94em; }
.ko-inline { color: var(--ink-2); margin-left: .4em; font-weight: 400; }
:root[data-lang="en"] .ko, :root[data-lang="en"] .ko-inline { display: none; }
:root[data-lang="ko"] .en { display: none; }
:root[data-lang="ko"] .ko { color: inherit; font-size: inherit; }
:root[data-lang="ko"] .ko-inline { color: inherit; margin-left: 0; }
:root[data-lang="ko"] body, :root[data-lang="both"] body { word-break: keep-all; }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 18px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.name { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; margin-right: auto; }
.name svg { width: 22px; height: 22px; flex: none; }
.name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
nav { display: flex; gap: 2px; }
nav a { display: flex; align-items: baseline; gap: 6px; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); font-size: 14px; white-space: nowrap; }
nav a b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); }
nav a:hover { background: var(--bg); text-decoration: none; }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
nav a[aria-current="page"] b { color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[aria-pressed="true"] .ko-inline { color: inherit; }
@media (max-width: 760px) { nav { order: 3; width: 100%; overflow-x: auto; } nav a { padding: 7px 10px; } .top-in { gap: 8px 12px; } .name { min-width: 0; } }

main { padding-block: 32px 56px; }
h1 { font-size: clamp(24px, 3.2vw, 32px); line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 650; text-wrap: balance; }
h1 .ko { font-size: .62em; font-weight: 500; margin-top: 6px; letter-spacing: 0; }
:root[data-lang="ko"] h1 .ko { font-size: 1em; font-weight: 650; margin-top: 0; }
h2 { font-size: 18px; letter-spacing: -.01em; margin: 0; font-weight: 650; }
h2 .ko-inline { font-size: .85em; }
h3 { margin: 0; }
.lede { color: var(--ink-2); max-width: 72ch; margin: 12px 0 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: .02em; }
.stack { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .lane > * { min-width: 0; }

/* page 1: stage strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 22px; }
.strip a { display: grid; gap: 2px; padding: 10px 12px 9px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; color: var(--ink); }
.strip a:hover { text-decoration: none; border-color: var(--line-2); border-top-color: var(--c); }
.strip .n { font-size: 24px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.strip .l { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.sel { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* area × stage matrix */
.mx-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.mx { width: 100%; border-collapse: collapse; font-size: 13px; }
.mx th, .mx td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.mx th:first-child, .mx td:first-child { text-align: left; }
.mx thead th { font-size: 11.5px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
.mx thead th .ko { font-weight: 500; font-size: 11px; }
.mx tbody tr:last-child td { border-bottom: 0; }
.mx td.c button { font: 600 13px var(--mono); border: 0; background: none; color: var(--ink); cursor: pointer; padding: 2px 8px; border-radius: 6px; min-width: 32px; }
.mx td.c button:hover { background: var(--accent-soft); color: var(--accent-ink); }
.mx td.z { color: var(--line-2); font-family: var(--mono); }
.mx td.tot { font-family: var(--mono); color: var(--muted); }
.mx tr.on td { background: var(--accent-soft); }

.lane { display: grid; gap: 12px; scroll-margin-top: 90px; grid-template-columns: minmax(0, 1fr); }
.lane-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--c); padding-bottom: 8px; }
.lane-h .count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.card-h { display: flex; gap: 10px; min-width: 0; align-items: flex-start; justify-content: space-between; }
.card-h > div { min-width: 0; }
.co { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.co .ko { font-size: 12.5px; color: var(--muted); }
.prod { font-size: 17px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; margin: 2px 0 0; }
.prod .ko { font-size: 14px; font-weight: 500; margin-top: 1px; }
:root[data-lang="ko"] .co .ko { font-size: inherit; color: inherit; }
:root[data-lang="ko"] .prod .ko { font-size: inherit; font-weight: inherit; }
.api { font-size: 13px; color: var(--muted); line-height: 1.45; }
.flag { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); flex: none; }
.flag.kr { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.stage { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); line-height: 1.5; }
.area { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); line-height: 1.5; }
.fresh { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); line-height: 1.5; }
.fresh.new { background: var(--ok-soft); color: var(--ok); }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; line-height: 1.3; }
.lbl .ko { display: block; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; }
:root[data-lang="ko"] .lbl .ko { font-size: 12px; }
.now { color: var(--ink); }
.when { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.trials { display: grid; gap: 6px; min-width: 0; }
.trial { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--ink-2); }
.trial a { font-family: var(--mono); font-size: 12px; }
.trial .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.st { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.st.done { background: var(--bg); color: var(--ink-2); }
.st.go { background: var(--ok-soft); color: var(--ok); }
.st.stop { background: var(--crit-soft); color: var(--crit); }
.st.unk { background: var(--warn-soft); color: var(--warn); }
.res { color: var(--ok); font-weight: 700; }
.dev { color: var(--ink-2); }
.srcl { font-size: 12px; }
.stopped > summary { cursor: pointer; list-style: none; }
.stopped > summary::-webkit-details-marker { display: none; }
.stopped .lane-h::after { content: "+"; font-family: var(--mono); color: var(--muted); }
.stopped[open] .lane-h::after { content: "–"; }
.stopped[open] .cards { margin-top: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 20px; color: var(--muted); text-align: center; }

/* page 2 */
.formula { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 16px; }
.terms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.term { padding: 14px; border-right: 1px solid var(--line-2); display: grid; gap: 4px; align-content: start; min-width: 0; }
.term:last-child { border-right: 0; }
.term .k { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; }
.term .v { font-weight: 600; font-size: 15px; line-height: 1.35; }
.term .d { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 860px) { .terms { grid-template-columns: minmax(0, 1fr); } .term { border-right: 0; border-bottom: 1px solid var(--line-2); } .term:last-child { border-bottom: 0; } }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: bottom; }
th .ko { font-weight: 500; font-size: 11px; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
.cat { display: grid; gap: 10px; }
.cat-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cat-h .k { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); }
.take { font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.take b { color: var(--ink); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.jump a { font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-2); background: var(--surface); }
.jump a:hover { text-decoration: none; border-color: var(--accent); color: var(--accent-ink); }
.bul { margin: 0; padding: 0; display: grid; gap: 8px; }
.bul li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
.todo { display: grid; gap: 10px; counter-reset: todo; }
.todo li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px 52px; position: relative; }
.todo li::before { counter-increment: todo; content: counter(todo); position: absolute; left: 16px; top: 13px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: var(--surface); font: 600 12.5px/24px var(--mono); text-align: center; }
.todo b { display: block; }
.todo .why { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.section-h { display: grid; gap: 4px; margin-bottom: 12px; }
.section-h p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 72ch; }
.cat .section-h { margin-bottom: 0; scroll-margin-top: 90px; }

/* page 3 */
.news { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.month { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 14px 16px 6px; background: var(--bg); border-top: 1px solid var(--line); }
.month:first-child { border-top: 0; }
.item { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: start; }
.month + .item { border-top: 0; }
.item .d { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.item .t { min-width: 0; }
.item .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 3px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--bg); color: var(--ink-2); }
.tag.kr { background: var(--accent-soft); color: var(--accent-ink); }
.tag.dv { background: var(--warn-soft); color: var(--warn); }
.item .s { font-size: 12.5px; white-space: nowrap; padding-top: 2px; }
@media (max-width: 600px) { .item { grid-template-columns: 1fr; } .item .s { white-space: normal; } }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-block: 18px 28px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="name">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.4 4.3 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.6-6.7 6-11z" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="14" r="2.6" fill="var(--accent)"/></svg>
      <div>Intranasal Pipeline Radar<small id="asof"></small></div>
    </div>
    <nav aria-label="Pages">
      <a href="#competitors" data-page="competitors"><b>1</b><span><span class="en">Competitors</span><span class="ko-inline">경쟁사</span></span></a>
      <a href="#endpoints" data-page="endpoints"><b>2</b><span><span class="en">Endpoints</span><span class="ko-inline">평가변수</span></span></a>
      <a href="#news" data-page="news"><b>3</b><span><span class="en">News</span><span class="ko-inline">뉴스</span></span></a>
    </nav>
    <div class="seg" id="lang" role="group" aria-label="Language">
      <button type="button" data-l="both">EN·KR</button><button type="button" data-l="en">EN</button><button type="button" data-l="ko">KR</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="p-competitors" class="stack"></section>
  <section id="p-endpoints" class="stack" hidden></section>
  <section id="p-news" class="stack" hidden></section>

tamine-approved-in-the-u-s-as-the-first-and-only-monotherapy-for-adults-with-treatment-resistant-depression"}}],"endpoints":{"categories":[{"key":"pk_bridge","name":{"en":"505(b)(2) PK/PD-bridging rescue products (nasal vs injection)","ko":"505(b)(2) PK/PD 가교 응급 제품 (비강 vs 주사)"},"products":[{"product":"Narcan (naloxone 4 mg nasal spray)","trial":{"en":"Healthy-volunteer comparative PK study (n=30): naloxone 2-8 mg IN (incl. the marketed 4 mg/0.1 mL) vs 0.4 mg IM; NIDA/Lightlake/Adapt study NCT02572089, matching the Narcan NDA label PK study","ko":"건강인 비교 PK 시험(30명): naloxone 2~8 mg IN(시판 4 mg/0.1 mL 포함) vs 0.4 mg IM. NIDA/Lightlake/Adapt 시험 NCT02572089로 Narcan NDA 허가사항의 PK 시험과 일치"},"primary":{"en":"Cmax, Tmax, AUC0-t, AUC0-inf, t1/2 of naloxone (NCT02572089 primary outcomes)","ko":"naloxone의 Cmax, Tmax, AUC0-t, AUC0-inf, t1/2 (NCT02572089 1차 평가변수)"},"secondary":{"en":"Comparator: naloxone 0.4 mg IM. Label reports relative BA of 4 mg (one nostril) and 8 mg (two nostrils) vs IM; early sampling at 2.5-20 min captures early exposure, which matters most clinically","ko":"대조약: naloxone 0.4 mg IM. 허가사항은 4 mg(한쪽 콧구멍)·8 mg(양쪽) vs IM 상대 BA를 제시. 2.5~20분 조기 채혈로 임상적으로 핵심인 조기 노출을 평가"},"timepoint":{"en":"Sampling up to 720 min post-dose","ko":"투여 후 720분까지 채혈"},"ncts":["NCT02572089"]},{"product":"Kloxxado (naloxone 8 mg nasal spray, Hikma)","trial":{"en":"8 mg: two comparative-BA PK studies in healthy adults (up to 24 each) vs 0.4 mg IM and 2 mg IV; 4 mg (added Aug 2025): PK study (up to 72) vs Kloxxado 8 mg and a previously approved 4 mg nasal spray; no NCT found","ko":"8 mg: 건강인 비교 BA PK 시험 2건(각 최대 24명), 0.4 mg IM 및 2 mg IV 대비. 4 mg(2025년 8월 추가): Kloxxado 8 mg 및 기허가 4 mg 비강 분무제 대비 PK 시험(최대 72명). NCT 확인 안 됨"},"primary":{"en":"Relative bioavailability of one 8 mg spray vs naloxone 0.4 mg IM and 2 mg IV (label)","ko":"8 mg 1회 분무 vs naloxone 0.4 mg IM 및 2 mg IV의 상대 생체이용률 (허가사항)"},"secondary":{"en":"Label: the 8 mg relative BA was shown vs injectable naloxone (0.4 mg IM, 2 mg IV); a later head-to-head PK study vs an approved 4 mg nasal spray supported the 4 mg strength","ko":"허가사항: 8 mg의 상대 BA는 주사용 naloxone(0.4 mg IM, 2 mg IV) 대비로 제시. 이후 기허가 4 mg 비강 분무제와 직접 비교한 PK 시험이 4 mg 용량 허가를 뒷받침"},"timepoint":{"en":"Single dose, full PK profile","ko":"단회 투여, 전체 PK 프로파일"},"ncts":[]},{"product":"Opvee (nalmefene 2.7 mg nasal spray, Indivior/Opiant)","trial":"PD study in opioid-experienced, non-dependent volunteers (remifentanil-induced respiratory depression model, crossover vs IN naloxone 4 mg) + PK study","primary":{"en":"PD: change in minute ventilation at 5 min during steady-state remifentanil infusion, non-inferiority vs naloxone 4 mg IN. PK: Cmax, Tmax, AUC-inf, t1/2","ko":"PD: remifentanil 정상상태 주입 중 5분 시점 분당환기량(minute ventilation) 변화, naloxone 4 mg IN 대비 비열등성. PK: Cmax, Tmax, AUC-inf, t1/2"},"secondary":{"en":"Label: onset 2.5-5 min, full recovery of respiratory drive 5-15 min, mean MV increase 5.745 L/min at 5 min (hypercapnia-response model, n=61)","ko":"허가사항: 효과 발현 2.5~5분, 호흡 구동 완전 회복 5~15분, 5분 시점 분당환기량 평균 5.745 L/min 증가 (고탄산혈증 반응 모델, 61명)"},"timepoint":{"en":"5 min (primary); PK to 48 h","ko":"5분 (1차); PK 48시간까지"},"ncts":["NCT04828005","NCT04759768"]},{"product":"neffy (epinephrine 2 mg / 1 mg nasal spray, ARS Pharma; Aptar Unidose device)","trial":"4 PK/PD studies in 175 healthy adults (no anaphylaxis), incl. repeat-dose study under nasal allergen challenge requested after the Sept 2023 CRL; supportive URTI/rhinitis PK study; single-arm pediatric PK study (n=42)","primary":{"en":"Epinephrine PK (Cmax, AUC, Tmax, partial AUCs). FDA criterion: minimum exposure >= epinephrine 0.3 mg IM/SC (efficacy) and maximum exposure < EpiPen (safety)","ko":"Epinephrine PK (Cmax, AUC, Tmax, 부분 AUC). FDA 기준: 최소 노출 >= epinephrine 0.3 mg IM/SC(유효성), 최대 노출 < EpiPen(안전성)"},"secondary":{"en":"PD: SBP and HR change vs EpiPen / IM syringe (sponsor: HR change > IM and EpiPen; BP > IM, numerically > EpiPen). Comparators: EpiPen 0.3 mg, IM epinephrine 0.3 mg","ko":"PD: EpiPen/IM 주사 대비 수축기혈압(SBP)·심박수(HR) 변화 (회사 발표: HR 변화 IM·EpiPen보다 큼, BP는 IM보다 크고 EpiPen보다 수치상 큼). 대조약: EpiPen 0.3 mg, IM epinephrine 0.3 mg"},"timepoint":{"en":"Early minutes to several hours post-dose; single and repeat (2-dose) administration","ko":"투여 직후 수 분~수 시간; 단회 및 반복(2회) 투여"},"ncts":["NCT04930900"]},{"product":"Baqsimi (glucagon 3 mg nasal powder, Lilly → Amphastar)","trial":{"en":"Two adult pivotal crossover non-inferiority studies vs glucagon 1 mg IM after insulin-induced hypoglycemia (NCT03339453, n=70; NCT01994746, n=83); pediatric studies NCT01997411 (4 to <17 y) and NCT04992312","ko":"인슐린 유발 저혈당 후 glucagon 1 mg IM 대비 성인 피보탈 교차 비열등성 시험 2건(NCT03339453, 70명; NCT01994746, 83명); 소아 시험 NCT01997411(4~17세 미만) 및 NCT04992312"},"primary":{"en":"Treatment success: plasma glucose rise to >=70 mg/dL OR >=20 mg/dL increase from nadir within 30 min (non-inferiority vs IM glucagon)","ko":"치료 성공: 투여 후 30분 이내 혈당 >=70 mg/dL 도달 또는 최저치 대비 >=20 mg/dL 상승 (IM glucagon 대비 비열등성)"},"secondary":{"en":"Time to treatment success, glucagon PK, nasal/ocular AEs; supportive common-cold PK study NCT02778100","ko":"치료 성공까지 시간, glucagon PK, 비강·안구 이상반응; 감기 상태 PK 보조시험 NCT02778100"},"timepoint":{"en":"Glucose at 0, 5, 10, 15, 20, 25, 30 min","ko":"혈당 0, 5, 10, 15, 20, 25, 30분 측정"},"ncts":["NCT03339453","NCT01994746","NCT01997411","NCT04992312"]},{"product":"Trudhesa (DHE nasal spray, Impel POD device)","trial":"INP104-101 relative-BA study vs D.H.E. 45 injection (systemic safety) and Migranal nasal (efficacy) + STOP 301 long-term safety","primary":{"en":"505(b)(2): PK bridge (Cmax, AUC) to DHE 45 IV and Migranal. STOP 301 primary: SAEs, TEAEs, change in nasal mucosa, change in olfactory function","ko":"505(b)(2): DHE 45 IV 및 Migranal 대비 PK 가교(Cmax, AUC). STOP 301 1차: 중대한 이상반응, TEAE, 비점막 변화, 후각 기능 변화"},"secondary":{"en":"Exploratory efficacy in open-label setting","ko":"공개 설계에서 탐색적 유효성"},"timepoint":{"en":"24 and 52 weeks (STOP 301)","ko":"24주 및 52주 (STOP 301)"},"ncts":["NCT03557333"]},{"product":"Atzumi (DHE 5.2 mg nasal powder, Satsuma/SNBL, SMART platform)","trial":"Phase 1 PK trial + ASCEND long-term open-label safety (placebo-controlled SUMMIT efficacy trial also run)","primary":{"en":"Approval basis = PK bridge + ASCEND safety. ASCEND registered primaries: % attacks with sustained pain freedom and sustained MBS freedom 2-48 h. SUMMIT: pain freedom and MBS freedom at 2 h","ko":"허가 근거 = PK 가교 + ASCEND 안전성. ASCEND 등록 1차: 2~48시간 지속 통증 소실·MBS 소실 발작 비율. SUMMIT: 2시간 통증 소실 및 MBS 소실"},"secondary":{"en":"Common ARs: rhinitis, nausea, altered taste, application-site reactions. First CRL was for manufacturing (CMC), not clinical data","ko":"주요 이상반응: 비염, 오심, 미각 이상, 투여부위 반응. 첫 CRL은 임상이 아닌 제조(CMC) 문제"},"timepoint":{"en":"Up to 12 months (ASCEND)","ko":"최대 12개월 (ASCEND)"},"ncts":["NCT04406649","NCT04940390"]}],"takeaway":{"en":"If a reference injection exists, FDA will usually accept a PK (± PD) bridge in healthy volunteers instead of an efficacy trial, but expect to bracket exposure (not below the IM dose, not above the autoinjector) and to add special-population PK (rhinitis/URTI, allergen challenge, repeat dosing).","ko":"기준 주사제가 있으면 FDA는 대개 유효성 시험 대신 건강인 PK(±PD) 가교를 인정하지만, 노출 범위를 양쪽으로 맞춰야 하고(IM 용량보다 낮지 않게, 자동주사기보다 높지 않게) 비염/상기도감염, 알레르겐 유발, 반복 투여 등 특수 조건 PK를 추가해야 한다."}},{"key":"migraine","name":{"en":"Acute migraine (nasal)","ko":"급성 편두통 (비강)"},"products":[{"product":"Zavzpret (zavegepant 10 mg nasal spray, Pfizer)","trial":{"en":"Study 301 (Phase 3) and Study 201 (Phase 2/3), both randomized, double-blind, placebo-controlled","ko":"Study 301(3상) 및 Study 201(2/3상), 모두 무작위 이중맹검 위약대조"},"primary":{"en":"Co-primary: % with freedom from pain at 2 h, and % with freedom from most bothersome symptom (MBS) at 2 h","ko":"공동 1차: 2시간 통증 소실 비율, 2시간 가장 괴로운 증상(MBS) 소실 비율"},"secondary":{"en":"Pain relief at 2 h, sustained pain freedom 2-24 h / 2-48 h, return to normal function, early timepoints (15-60 min)","ko":"2시간 통증 완화, 2~24/2~48시간 지속 통증 소실, 정상 기능 회복, 조기 시점(15~60분)"},"timepoint":{"en":"2 h post-dose","ko":"투여 후 2시간"},"ncts":["NCT04571060","NCT03872453"]},{"product":"Atzumi (DHE nasal powder) - SUMMIT","trial":"SUMMIT placebo-controlled Phase 3","primary":{"en":"Co-primary pain freedom and MBS freedom at 2 h (approval ultimately relied on PK bridge + ASCEND safety)","ko":"공동 1차 2시간 통증 소실 및 MBS 소실 (최종 허가는 PK 가교 + ASCEND 안전성에 근거)"},"secondary":{"en":"Sustained freedom endpoints, tolerability","ko":"지속 소실 지표, 내약성"},"timepoint":{"en":"2 h","ko":"2시간"},"ncts":["NCT04940390"]}],"takeaway":{"en":"For a new chemical entity the FDA acute-migraine co-primaries (pain freedom + MBS freedom at 2 h) are non-negotiable; for a reformulated old drug (DHE) a PK bridge plus long-term nasal safety can replace a positive efficacy trial.","ko":"신규 물질이면 FDA 급성 편두통 공동 1차(2시간 통증 소실 + MBS 소실)는 사실상 고정이다. 기존 약물(DHE) 제형 변경이라면 PK 가교와 장기 비강 안전성으로 유효성 시험을 대신할 수 있다."}},{"key":"seizure","name":{"en":"Seizure-cluster rescue","ko":"군집 발작 응급 치료"},"products":[{"product":"Nayzilam (midazolam 5 mg nasal spray, UCB)","trial":"ARTEMIS-1 (randomized, double-blind, placebo-controlled)","primary":{"en":"Treatment success: seizure termination within 10 min AND no recurrence from 10 min to 6 h after the double-blind dose","ko":"치료 성공: 이중맹검 투여 후 10분 이내 발작 종료 그리고 10분~6시간 동안 재발 없음"},"secondary":{"en":"Seizure recurrence >10 min to 4 h, any seizure to 24 h, time to next seizure (to 24 h)","ko":"10분 초과~4시간 발작 재발, 24시간까지 발작 발생, 다음 발작까지 시간(24시간까지)"},"timepoint":{"en":"10 min and 6 h","ko":"10분 및 6시간"},"ncts":["NCT01390220"]},{"product":"Valtoco (diazepam nasal spray, Neurelis; Intravail enhancer)","trial":{"en":"PK bridge to Diastat rectal gel (505(b)(2)) + ictal/peri-ictal PK study + 12-month repeat-dose safety study; ages 2-5 added Apr 2025 based on a Phase 1/2a safety/PK study","ko":"Diastat 직장 겔 대비 PK 가교(505(b)(2)) + 발작 중/주변기 PK 시험 + 12개월 반복투여 안전성 시험; 2~5세는 2025년 4월 1/2a상 안전성·PK 시험을 근거로 추가"},"primary":{"en":"Diazepam Cmax/AUC during ictal/peri-ictal period; long-term study: number of participants/AEs over 12 months","ko":"발작 중/주변기 diazepam Cmax/AUC; 장기시험: 12개월간 참여자 수/이상반응"},"secondary":{"en":"Proportion of second doses within 24 h (efficacy proxy), nasal irritation, dysgeusia","ko":"24시간 내 2차 투여 비율(유효성 대리지표), 비강 자극, 미각 이상"},"timepoint":{"en":"PK 0-6 h; safety 12 months","ko":"PK 0~6시간; 안전성 12개월"},"ncts":["NCT02724423","NCT02721069"]}],"takeaway":{"en":"A new molecule needs the ARTEMIS-style 10 min / 6 h treatment-success endpoint; a new nasal form of an approved benzodiazepine can be bridged by PK plus a large long-term safety cohort.","ko":"신규 물질은 ARTEMIS 방식의 10분/6시간 치료 성공 지표가 필요하고, 허가된 벤조디아제핀의 새 비강 제형은 PK와 대규모 장기 안전성 코호트로 가교할 수 있다."}},{"key":"psychiatry","name":{"en":"Psychiatry (depression, social anxiety)","ko":"정신과 (우울증, 사회불안)"},"products":[{"product":"Spravato (esketamine nasal spray, J&J) - induction","trial":"TRANSFORM-2 (flexible dose + oral AD); TRANSFORM-1 (fixed dose)","primary":{"en":"Change from baseline in MADRS total score at Day 28 (MMRM)","ko":"28일차 MADRS 총점 기저치 대비 변화 (MMRM)"},"secondary":{"en":"Onset of response by Day 2 sustained, response/remission rates, SDS, PHQ-9; dissociation (CADSS), BP monitoring","ko":"2일차 반응 후 지속, 반응/관해율, SDS, PHQ-9; 해리(CADSS), 혈압 모니터링"},"timepoint":{"en":"Day 28 (Week 4)","ko":"28일 (4주)"},"ncts":["NCT02418585","NCT02417064"]},{"product":"Spravato - relapse prevention","trial":"SUSTAIN-1 (randomized withdrawal)","primary":{"en":"Time to relapse in patients in stable remission (randomized withdrawal design)","ko":"안정 관해 환자에서 재발까지 시간 (무작위 중단 설계)"},"secondary":{"en":"Time to relapse in stable responders","ko":"안정 반응자에서 재발까지 시간"},"timepoint":{"en":"Up to 92 weeks maintenance","ko":"유지기 최대 92주"},"ncts":["NCT02493868"]},{"product":"Spravato - monotherapy (approved Jan 21, 2025)","trial":"Monotherapy RCT (n=477; 56 mg, 84 mg, placebo)","primary":{"en":"Change in MADRS total score from Day 1 to Day 28","ko":"1일차~28일차 MADRS 총점 변화"},"secondary":{"en":"Remission at Week 4 (MADRS <=12): 22.5% vs 7.6% placebo","ko":"4주 관해(MADRS <=12): 22.5% vs 위약 7.6%"},"timepoint":{"en":"Day 28","ko":"28일"},"ncts":["NCT04599855"]},{"product":"fasedienol (PH94B nasal spray, Vistagen) - investigational","trial":"PALISADE-1 (failed), PALISADE-2 (positive per sponsor), PALISADE-3 (failed Dec 17, 2025), PALISADE-4 (ongoing)","primary":{"en":"Change in Subjective Units of Distress Scale (SUDS) during an in-clinic public-speaking challenge vs baseline challenge","ko":"병원 내 대중 연설 과제 중 주관적 고통 척도(SUDS) 변화 (기저 과제 대비)"},"secondary":{"en":"Clinician Global Impression of Improvement (CGI-I), Patient Global Impression of Change (PGI-C). PALISADE-3: LS mean change 13.6 vs 14.0 placebo, not significant","ko":"CGI-I, PGI-C. PALISADE-3: 최소제곱평균 변화 13.6 vs 위약 14.0, 유의성 없음"},"timepoint":{"en":"Single acute dose; challenge ~Day 7 after baseline visit","ko":"단회 급성 투여; 기저 방문 후 약 7일째 과제"},"ncts":["NCT04754802","NCT05011396","NCT06358651","NCT06615557"]}],"takeaway":{"en":"Nasal CNS drugs are judged on the same scales as oral drugs (MADRS Day 28, relapse time); acute 'challenge' endpoints like SUDS have high placebo response and replicate poorly, so power and site training matter more than the route.","ko":"비강 CNS 약물도 경구 약물과 동일한 척도(28일 MADRS, 재발까지 시간)로 평가된다. SUDS 같은 급성 유발 과제 지표는 위약 반응이 크고 재현이 어렵기 때문에 투여 경로보다 검정력과 기관 교육이 더 중요하다."}},{"key":"psvt","name":{"en":"PSVT (cardiology)","ko":"발작성 심실상성 빈맥 (PSVT)"},"products":[{"product":"Cardamyst (etripamil 70 mg nasal spray, Milestone) - FDA approved Dec 12, 2025","trial":"RAPID (NODE-301 Part 2), patient self-administration at home vs placebo","primary":{"en":"Time to conversion of PSVT to sinus rhythm (>=30 s) within 30 min of dosing (adjudicated by ECG monitor)","ko":"투여 후 30분 이내 동리듬(30초 이상) 전환까지 시간 (심전도 모니터로 판정)"},"secondary":{"en":"Conversion at 30 min: 64% vs 31% placebo (RAPID, HR 2.6); median time to conversion 17.2 vs 53.5 min; ED visits/medical interventions avoided; nasal AEs","ko":"30분 내 전환율: 64% vs 위약 31% (RAPID, HR 2.6); 전환까지 중앙값 17.2분 vs 53.5분; 응급실 방문·의료 개입 회피; 비강 이상반응"},"timepoint":{"en":"30 min (NODE-301 Part 1 used 5 h window)","ko":"30분 (NODE-301 Part 1은 5시간 창)"},"ncts":["NCT03464019"]}],"takeaway":{"en":"Self-administered nasal products for episodic events need an event-driven, ambulatory-monitored trial with a short, objective window (30 min).","ko":"에피소드성 질환용 자가투여 비강 제품은 짧고 객관적인 평가 시간창(30분)을 둔 사건 중심·외래 모니터링 임상이 필요합니다."}},{"key":"crs","name":{"en":"Chronic rhinosinusitis / nasal polyps (local action)","ko":"만성 비부비동염 / 비용종 (국소 작용)"},"products":[{"product":"Xhance (fluticasone propionate, Optinose Exhalation Delivery System) - nasal polyps","trial":"NAVIGATE I and NAVIGATE II","primary":{"en":"Co-primary: change in 7-day average morning nasal congestion/obstruction score (Week 4) and change in total endoscopic polyp grade (Week 16)","ko":"공동 1차: 7일 평균 아침 코막힘/폐쇄 점수 변화(4주) 및 내시경 비용종 총 등급 변화(16주)"},"secondary":{"en":"SNOT-22, PNIF, diary hyposmia score, polyp elimination (grade 0), PGIC","ko":"SNOT-22, PNIF, 일지 후각저하 점수, 비용종 소실(등급 0), PGIC"},"timepoint":{"en":"Week 4 and Week 16; 8-week open-label extension","ko":"4주 및 16주; 8주 공개 연장"},"ncts":["NCT01622569","NCT01624662"]},{"product":"Xhance - CRS without polyps (sNDA approved 2024)","trial":"ReOpen1 and ReOpen2","primary":{"en":"Co-primary: change in composite symptom score (congestion + facial pain/pressure + discharge) at Week 4, and change in average percent of opacified volume (APOV) of ethmoid/maxillary sinuses on CT at Week 24","ko":"공동 1차: 4주 복합 증상 점수(코막힘+안면 통증/압박+콧물) 변화, 24주 CT 사골/상악동 평균 혼탁 부피 비율(APOV) 변화"},"secondary":{"en":"Acute exacerbations, SNOT-22, PGIC","ko":"급성 악화, SNOT-22, PGIC"},"timepoint":{"en":"Week 4 (symptoms), Week 24 (CT)","ko":"4주(증상), 24주(CT)"},"ncts":["NCT03781804","NCT03960580"]},{"product":"LYR-210 (mometasone sinonasal implant, Lyra) - development suspended Jan 2026","trial":{"en":"ENLIGHTEN 1 (missed primary, May 2024) and ENLIGHTEN 2 (positive, Jun 2025), sham-controlled","ko":"ENLIGHTEN 1(1차 미충족, 2024년 5월) 및 ENLIGHTEN 2(긍정적, 2025년 6월), 샴 대조"},"primary":{"en":"Change in 7-day average composite score of 3 cardinal symptoms (3CS: obstruction, discharge, facial pain/pressure) in patients without polyps","ko":"비용종 없는 환자에서 3대 주증상(3CS: 코막힘, 콧물, 안면 통증/압박) 7일 평균 복합 점수 변화"},"secondary":{"en":"ENLIGHTEN 2: 3CS -1.13 (p=0.0078); 3CS full population -0.90 (p=0.0209); SNOT-22 -8.7 (p=0.0101); CT opacification, need for rescue","ko":"ENLIGHTEN 2: 3CS -1.13 (p=0.0078); 전체 집단 3CS -0.90 (p=0.0209); SNOT-22 -8.7 (p=0.0101); CT 혼탁도, 구제치료 필요"},"timepoint":{"en":"Week 24","ko":"24주"},"ncts":["NCT05219968","NCT05295459"]}],"takeaway":{"en":"Locally acting products need a patient-reported symptom score PLUS an objective anatomical endpoint (endoscopic polyp grade or CT opacification); device-driven deposition claims only count if they move those endpoints.","ko":"국소 작용 제품은 환자 보고 증상 점수와 객관적 해부학적 지표(내시경 비용종 등급 또는 CT 혼탁도)를 함께 충족해야 하며, 디바이스 기반 침착 개선 주장은 이 지표들을 움직일 때만 의미가 있다."}},{"key":"vaccine","name":{"en":"Nasal vaccines","ko":"비강 백신"},"products":[{"product":"FluMist (live attenuated influenza vaccine, AstraZeneca); self/caregiver administration approved Sept 2024, FluMist Home launched Aug 2025","trial":"CAIV-T vs TIV in children 6-59 months (pivotal comparative efficacy)","primary":{"en":"Relative efficacy vs inactivated vaccine against culture-confirmed symptomatic influenza (vaccine-like strains), >=14 days after last dose","ko":"불활화 백신 대비 배양 확진 증상성 인플루엔자(백신 유사주) 상대 효능, 마지막 접종 14일 이후"},"secondary":{"en":"Serum HAI antibody titers, nasal wash sIgA (exploratory), viral shedding, reactogenicity (runny nose, wheezing in young children)","ko":"혈청 HAI 항체가, 비강 세척액 sIgA(탐색적), 백신 바이러스 배출(shedding), 반응원성(콧물, 영유아 천명)"},"timepoint":{"en":"Full influenza season","ko":"인플루엔자 유행 시즌 전체"},"ncts":["NCT00128167"]},{"product":"iNCOVACC / BBV154 (intranasal adenovirus-vector COVID-19, Bharat Biotech)","trial":"Phase 3 immunogenicity/safety","primary":{"en":"Geometric mean titers (neutralizing antibody) at Day 28/42/90/180; solicited AEs (7 days), unsolicited AEs (to Day 180)","ko":"28/42/90/180일 중화항체 기하평균역가(GMT); 7일 유발 이상반응, 180일까지 비유발 이상반응"},"secondary":{"en":"Mucosal (nasal) IgA, cellular immunity","ko":"점막(비강) IgA, 세포성 면역"},"timepoint":{"en":"Day 28 to Day 180","ko":"28일~180일"},"ncts":["NCT05522335"]}],"takeaway":{"en":"Licensure still hinges on systemic immunogenicity or clinical efficacy; nasal sIgA is supportive only, so a mucosal platform must also generate serum correlates and shedding/transmission data.","ko":"허가는 여전히 전신 면역원성 또는 임상 효능에 좌우되며 비강 sIgA는 보조 자료일 뿐이다. 점막 플랫폼도 혈청 상관지표와 shedding/전파 데이터를 함께 확보해야 한다."}},{"key":"n2b","name":{"en":"Nose-to-brain (exploratory CNS)","ko":"Nose-to-brain (탐색적 CNS)"},"products":[{"product":"Intranasal insulin (SNIFF, Alzheimer's/MCI)","trial":"SNIFF Phase 2/3 (device-delivered insulin vs placebo)","primary":{"en":"Change in ADAS-Cog12","ko":"ADAS-Cog12 변화"},"secondary":{"en":"CSF Abeta/tau biomarkers, MRI, ADCS-ADL, memory composites (published result: primary not met; device change mid-study was a confounder)","ko":"CSF Aβ/tau 바이오마커, MRI, ADCS-ADL, 기억 복합 지표 (발표 결과: 1차 미충족; 시험 중 디바이스 교체가 교란 요인)"},"timepoint":{"en":"12 months blinded + 6 months open-label","ko":"12개월 맹검 + 6개월 공개"},"ncts":["NCT01767909"]},{"product":"Generic N2B proof-of-concept designs","trial":"Phase 1 / translational","primary":{"en":"CSF-to-plasma AUC ratio vs IV reference; PET or radiolabel imaging of olfactory/brain deposition","ko":"IV 기준 대비 CSF/혈장 AUC 비; 후각부/뇌 침착 PET 또는 방사표지 영상"},"secondary":{"en":"Target-engagement biomarkers, EEG/fMRI, cognitive or behavioral scales","ko":"표적 결합 바이오마커, EEG/fMRI, 인지·행동 척도"},"timepoint":{"en":"Hours (PK/imaging) to 12 months (cognition)","ko":"수 시간(PK/영상) ~ 12개월(인지)"},"ncts":[]}],"takeaway":{"en":"No N2B product has been approved on a 'direct-to-brain' claim; regulators will still want a standard clinical endpoint, and a mid-trial device change can sink the study, so freeze the device before Phase 2.","ko":"'뇌 직접 전달'을 근거로 허가된 N2B 제품은 아직 없다. 규제기관은 표준 임상 지표를 요구하며, 시험 중 디바이스 교체는 시험 실패로 이어질 수 있으므로 2상 전에 디바이스를 확정해야 한다."}}],"guidance":[{"agency":"FDA","title":"Nasal Spray and Inhalation Solution, Suspension, and Spray Drug Products - Chemistry, Manufacturing, and Controls Documentation (final)","year":"2002","url":"https://www.fda.gov/media/70857/download","why":{"en":"Defines the in vitro CMC tests every nasal spray needs (spray content uniformity, droplet size, spray pattern, plume geometry, priming). Final, July 2002 (docket FDA-1999-D-0060); does not cover nasal powders. Page URL verified 2026-10-21.","ko":"모든 비강 분무제에 필요한 체외 CMC 시험(분무 함량 균일성, 액적 크기, 분무 패턴, 플룸 형상, 프라이밍)을 규정. 2002년 7월 최종(Docket FDA-1999-D-0060); 비강 분말제는 적용 제외. 2026-10-21 URL 확인."}},{"agency":"FDA","title":"Bioavailability and Bioequivalence Studies for Nasal Aerosols and Nasal Sprays for Local Action (draft)","year":"2003","url":"https://www.fda.gov/media/70867/download","why":{"en":"Still listed as draft (docket FDA-1999-D-0050); partly superseded by product-specific guidances (e.g., fluticasone PSG states it supersedes the 2003 draft).","ko":"여전히 초안으로 게재(Docket FDA-1999-D-0050); fluticasone PSG 등 제품별 가이던스가 일부 대체."}},{"agency":"FDA","title":"Product-Specific Guidances database (nasal sprays incl. naloxone, fluticasone, mometasone etc.)","year":"ongoing","url":"https://www.accessdata.fda.gov/scripts/cder/psg/index.cfm","why":{"en":"Nasal PSGs give the exact in vitro tests (single actuation content, DSD, drug in small droplets, spray pattern, plume geometry; 3+ batches) and PK study design; naloxone PSG allows in vitro-only BE if Q1/Q2 same.","ko":"비강 PSG는 체외 시험 항목(단회 분무 함량, 액적 분포, 미세 액적 내 약물, 분무 패턴, 플룸 형상; 3배치 이상)과 PK 설계를 명시. naloxone PSG는 Q1/Q2 동일 시 체외 BE만으로 허용."}},{"agency":"FDA (OGD presentation)","title":"Complex Nasal Suspension PSGs: Utilization of Newly Recommended In Vitro Only Bioequivalence Option (S. Boc, FDA OGD, SBIA 2023; GDUFA research supporting revision of 9 nasal suspension PSGs)","year":"2023 (13 Sep)","url":"https://www.fda.gov/media/173383/download","why":{"en":"Shows FDA's move toward in vitro-only BE (Option 1 for Q1/Q2 same) for nasal suspensions, reducing need for clinical endpoint BE.","ko":"비강 현탁제에서 체외 단독 BE(Q1/Q2 동일 시 Option 1)로의 전환을 보여주며 임상 종료점 BE 필요성을 줄임."}},{"agency":"FDA","title":"Migraine: Developing Drugs for Acute Treatment (final)","year":"2018","url":"https://www.fda.gov/media/89829/download","why":{"en":"Source of the co-primary pain freedom + MBS freedom at 2 h used by Zavzpret/SUMMIT. Final, Feb 2018 (docket FDA-2014-D-1540); URL verified 2026-10-21.","ko":"Zavzpret/SUMMIT가 사용한 2시간 통증 소실 + MBS 소실 공동 1차의 근거. 2018년 2월 최종(Docket FDA-2014-D-1540); 2026-10-21 URL 확인."}},{"agency":"FDA","title":"Bridging for Drug-Device and Biologic-Device Combination Products (draft)","year":"2019","url":"https://www.fda.gov/media/133676/download","why":{"en":"How to bridge data when the nasal device changes between development and commercial versions. Still draft (Dec 2019, docket FDA-2019-D-5585); URL verified 2026-10-21.","ko":"개발용과 상업용 비강 디바이스가 바뀔 때 데이터 가교 방법. 여전히 초안(2019년 12월, Docket FDA-2019-D-5585); 2026-10-21 URL 확인."}},{"agency":"EMA","title":"Guideline on the pharmaceutical quality of inhalation and nasal medicinal products, Revision 1","year":"2025 (adopted 14 Jul 2025; effective 1 Feb 2026)","url":"https://www.ema.europa.eu/en/documents/scientific-guideline/guideline-pharmaceutical-quality-inhalation-nasal-medicinal-products-revision-1_en.pdf","why":{"en":"Replaces the 2006 guideline; now in force for EU filings and adds Medical Device Regulation considerations for integral devices.","ko":"2006년 가이드라인을 대체하며 현재 EU 허가에 적용; 일체형 디바이스에 대한 의료기기규정(MDR) 고려사항 추가."}},{"agency":"EMA","title":"Guideline on the requirements for demonstrating therapeutic equivalence for nasal products (draft, EMA/220888/2026)","year":"2026 (draft released 5 Oct 2026; consultation to 28 Feb 2027; concept paper Jul 2024)","url":"https://www.ema.europa.eu/en/documents/scientific-guideline/draft-guideline-requirements-demonstrating-therapeutic-equivalence-nasal-products_en.pdf","why":{"en":"Sets a stepwise TE approach (in vitro comparison, then PK) for local and systemic nasal products (examples: xylometazoline, naloxone); draft in consultation until 28 Feb 2027.","ko":"국소·전신 비강 제품(예: xylometazoline, naloxone)의 단계적 치료적 동등성 입증(체외 비교 후 PK) 요건을 제시; 2027년 2월 28일까지 의견수렴 중인 초안."}},{"agency":"WHO PQ","title":"Notes on the design of bioequivalence study: naloxone nasal","year":"2026 (May)","url":"https://extranet.who.int/prequal/sites/default/files/document_files/BE%20Naloxone_nasal_May2026.pdf","why":{"en":"Recent BE design template for a systemic nasal product; useful for LMIC/tender markets.","ko":"전신 작용 비강 제품의 최신 BE 설계 예시; 중저소득국/입찰 시장에 유용."}},{"agency":"MFDS","title":"폐흡입제 동등성 입증 가이드라인 (inhalation equivalence guideline; no nasal-specific MFDS guideline found)","year":"2015","url":"https://medigatenews.com/news/3686095945","why":{"en":"MFDS aligned inhalation equivalence with EU in 2015; no dedicated nasal spray guideline was found, so expect MFDS to lean on FDA/EMA documents - confirm via pre-consultation (unconfirmed that none exists).","ko":"식약처는 2015년 흡입제 동등성 기준을 EU에 맞췄으나 비강 분무제 전용 가이드라인은 확인되지 않음. FDA/EMA 문서를 준용할 가능성이 높으므로 사전상담으로 확인 필요 (부재 여부 미확인)."}}],"localSafety":[{"en":"Nasal mucosal examination by ENT with a predefined scoring scale (erythema, edema, crusting, epistaxis, ulceration/septal perforation) at baseline and repeatedly; Trudhesa STOP 301 made 'change in nasal mucosa' a PRIMARY endpoint over 24/52 weeks (NCT03557333).","ko":"이비인후과 전문의의 사전 정의 점수 척도(홍반, 부종, 가피, 비출혈, 궤양/비중격 천공)로 기저 및 반복 비점막 검사. Trudhesa STOP 301은 24/52주 '비점막 변화'를 1차 평가변수로 설정 (NCT03557333)."},{"en":"Olfactory function testing (UPSIT or Sniffin' Sticks) at baseline and end of treatment; a PRIMARY endpoint in STOP 301 (UPSIT) and a secondary (SIT) in the Xhance ReOpen CRS trials.","ko":"기저 및 치료 종료 시 후각 기능 검사(UPSIT 또는 Sniffin' Sticks). STOP 301의 1차 지표(UPSIT)이자 Xhance ReOpen CRS 시험의 2차 지표(SIT)."},{"en":"Subject-rated nasal discomfort/irritation VAS, taste disturbance (dysgeusia), lacrimation, sneezing and runny nose immediately after dosing; common ARs on recent labels (Atzumi: rhinitis, altered taste, application-site reactions).","ko":"투여 직후 환자 평가 비강 불편감/자극 VAS, 미각 이상, 눈물, 재채기, 콧물. 최근 허가사항의 주요 이상반응(Atzumi: 비염, 미각 이상, 투여부위 반응)."},{"en":"Special nasal-condition PK: upper respiratory infection / rhinitis (neffy NCT04930900; Baqsimi common-cold study NCT02778100) and repeat dosing under nasal allergen challenge (requested by FDA in the neffy 2023 CRL).","ko":"특수 비강 상태 PK: 상기도감염/비염(neffy NCT04930900; Baqsimi 감기 시험 NCT02778100), 비강 알레르겐 유발 하 반복 투여(neffy 2023 CRL에서 FDA 요청)."},{"en":"In vitro device performance (FDA 2002 CMC; PSGs; EMA 2025 Rev 1): single-actuation/delivered dose content, droplet size distribution (laser diffraction), % drug in small droplets <10 um (lung exposure), spray pattern and plume geometry, priming/repriming, tail-off; >=3 batches.","ko":"체외 디바이스 성능(FDA 2002 CMC; PSG; EMA 2025 Rev 1): 단회 분무/전달 용량 함량, 레이저 회절 액적 분포, 10 µm 미만 미세 액적 내 약물 비율(폐 노출), 분무 패턴·플룸 형상, 프라이밍/재프라이밍, 말기 분무; 3배치 이상."},{"en":"For nasal spray suspensions: drug particle size distribution in the formulation (FDA OGD cites MDRS as an example method) and dissolution are in vitro BE options in the 9 revised PSGs; powders have no equivalent PSG pathway yet.","ko":"비강 분무 현탁제: 제형 내 API 입자 크기 분포(FDA OGD가 MDRS를 예시 방법으로 제시)와 용출이 개정된 PSG 9건의 체외 BE 옵션. 분말제는 아직 동등한 PSG 경로 없음."},{"en":"Regional deposition: gamma scintigraphy or nasal cast (anatomical replica) studies are supportive (not a required regulatory endpoint) but important for N2B/olfactory-region or sinus-targeting claims.","ko":"부위별 침착: 감마 신티그래피 또는 비강 캐스트(해부학적 모형) 연구는 필수 규제 지표는 아니나 N2B/후각부 또는 부비동 표적 주장에 중요."},{"en":"Human factors / usability validation and device robustness (temperature excursions, freezing, carry case) - neffy's 2026 label adds use after freezing and exposure up to 122 F; Orexo OX124 CRL (2024) required an additional HF study.","ko":"인적요인/사용성 검증 및 디바이스 견고성(온도 이탈, 동결, 휴대 케이스). neffy 2026 허가사항에 동결 후 사용 및 122°F 노출 허용 추가; Orexo OX124 CRL(2024)은 추가 HF 시험 요구."}],"todo":[{"h":{"en":"Copy the accepted primary endpoint exactly","ko":"이미 인정된 1차 평가변수를 그대로 사용하라"},"why":{"en":"Every approved nasal product in each category used the same agency-endorsed endpoint (2 h pain + MBS freedom; 30-min glucose criteria; 30-min sinus-rhythm conversion; MADRS Day 28). Inventing a new endpoint adds review risk with no upside.","ko":"각 범주의 허가 비강 제품은 모두 규제기관이 인정한 동일 지표(2시간 통증+MBS 소실, 30분 혈당 기준, 30분 동리듬 전환, 28일 MADRS)를 썼다. 새로운 지표를 만들면 이점 없이 심사 위험만 커진다."}},{"h":{"en":"Agree the PK bridge window with FDA before the first human study","ko":"첫 인체시험 전에 FDA와 PK 가교 범위를 합의하라"},"why":{"en":"neffy shows FDA may require exposure bracketed between the IM dose (floor) and the autoinjector (ceiling) plus PD; a Type B pre-IND meeting fixes the comparator, partial AUC and PD endpoints up front.","ko":"neffy 사례처럼 FDA는 IM 용량(하한)과 자동주사기(상한) 사이 노출 및 PD를 요구할 수 있다. Type B pre-IND 회의로 대조약, 부분 AUC, PD 지표를 미리 확정해야 한다."}},{"h":{"en":"Run 'bad-nose' PK early (rhinitis, URTI, allergen challenge, repeat dosing)","ko":"'나쁜 코' 조건 PK(비염, 상기도감염, 알레르겐 유발, 반복 투여)를 조기에 수행하라"},"why":{"en":"neffy's 2023 CRL asked for repeat dosing under nasal allergen challenge, and Baqsimi/neffy both ran URTI studies; doing them late delays approval by a cycle.","ko":"neffy 2023 CRL은 비강 알레르겐 유발 하 반복 투여를 요구했고 Baqsimi와 neffy 모두 상기도감염 시험을 수행했다. 늦게 하면 허가가 한 사이클 지연된다."}},{"h":{"en":"Build a standard local-tolerability module into every protocol","ko":"모든 프로토콜에 표준 국소 내약성 모듈을 넣어라"},"why":{"en":"ENT mucosal assessment and olfactory testing (UPSIT) were primary endpoints in Trudhesa's STOP 301; a reusable module (adding nasal VAS) across our pipeline creates a comparable platform safety database for every filing.","ko":"비점막 평가와 후각 검사(UPSIT)는 Trudhesa STOP 301의 1차 지표였다. 파이프라인 전체에 재사용 가능한 모듈(비강 VAS 추가)을 두면 모든 허가에 활용 가능한 플랫폼 안전성 DB가 쌓인다."}},{"h":{"en":"Treat device/CMC and human factors as the critical path, not clinical","ko":"임상이 아닌 디바이스/CMC와 인적요인을 핵심 경로로 관리하라"},"why":{"en":"Recent nasal CRLs were non-clinical: Atzumi (manufacturing), Orexo OX124 (packaging, then HF + commercial-scale data). Freeze the device, run 3-batch in vitro characterization (FDA 2002 for sprays; EMA 2025 Rev 1 also covers powders), and validate HF before pivotal.","ko":"최근 비강 제품 CRL은 비임상 사유였다: Atzumi(제조), Orexo OX124(포장, 이후 HF 및 상업 규모 데이터). 디바이스를 확정하고 3배치 체외 특성 평가(분무제는 FDA 2002, 분말제는 EMA 2025 Rev 1도 적용)와 HF 검증을 피보탈 전에 완료하라."}},{"h":{"en":"License an open-access approved powder device rather than build from scratch","ko":"처음부터 개발하기보다 허가 이력이 있는 개방형 분말 디바이스를 도입하라"},"why":{"en":"In 2026 several powder devices opened to third parties: SNBL's FDA-approved Atzumi device via Bespak (MOU, Oct 2026), plus Hovione/IDC (May 2026) and Nemera-Therakind DriDose (Apr 2026) without an approved product yet; an approved device shortens CMC/HF work and supports a Korean-first-then-US filing plan with MFDS pre-consultation.","ko":"2026년 여러 분말 디바이스가 외부에 개방되었다: Bespak을 통한 SNBL의 FDA 허가 Atzumi 디바이스(MOU, 2026년 10월), 그리고 아직 허가 제품이 없는 Hovione/IDC(2026년 5월)와 Nemera-Therakind DriDose(2026년 4월). 허가된 디바이스는 CMC/HF 작업을 줄이며, 식약처 사전상담을 병행한 국내 우선 후 미국 허가 전략에 유리하다."}}],"title":{"en":"How nasal products are measured, and what we should do","ko":"비강 제품은 어떻게 평가되는가, 그리고 우리가 할 일"},"lede":{"en":"Most approved nasal products reached market by one of two routes: a PK bridge to an approved injection or oral form, or a full efficacy program with the standard clinical endpoint for the disease. Nasal tolerability and device performance tests are added on either route.","ko":"승인된 비강 제품 대부분은 두 경로 중 하나로 시판되었습니다. 기존 주사제·경구제와의 PK 가교, 또는 해당 질환의 표준 임상 평가변수를 쓰는 본격 유효성 임상입니다. 어느 경로든 비강 내약성과 디바이스 성능 시험이 추가됩니다."},"routes":[{"k":{"en":"Route A","ko":"경로 A"},"v":{"en":"PK bridge (505(b)(2))","ko":"PK 가교 (505(b)(2))"},"d":{"en":"Cmax, AUC and Tmax vs the approved IM/IV/SC reference in healthy volunteers; PD added where exposure alone is not persuasive (epinephrine, glucagon, opioid reversal).","ko":"건강인 대상 기존 IM/IV/SC 대조약과 Cmax·AUC·Tmax 비교. 노출량만으로 설득이 어려우면 PD 추가(에피네프린, 글루카곤, 오피오이드 역전)."}},{"k":{"en":"Route B","ko":"경로 B"},"v":{"en":"Efficacy program","ko":"유효성 임상"},"d":{"en":"Disease-standard primary endpoint against placebo: MADRS, 2-h pain freedom, seizure termination, conversion to sinus rhythm, polyp/congestion scores, lab-confirmed infection.","ko":"위약 대비 질환 표준 1차 평가변수: MADRS, 2시간 통증 소실, 발작 종료, 동율동 전환, 비용종·코막힘 점수, 확진 감염."}},{"k":{"en":"Always","ko":"공통"},"v":{"en":"Nasal safety set","ko":"비강 안전성 세트"},"d":{"en":"Nasal mucosal exam, irritation/discomfort scores, smell testing, and repeat-dose tolerability.","ko":"비점막 검사, 자극·불편감 점수, 후각 검사, 반복 투여 내약성."}},{"k":{"en":"CMC","ko":"CMC"},"v":{"en":"Device performance","ko":"디바이스 성능"},"d":{"en":"Spray pattern, plume geometry, droplet/particle size, shot weight and dose uniformity: the in-vitro data FDA uses for nasal BE.","ko":"분무 패턴, 플룸 형상, 액적/입자 크기, 분사량, 용량 균일성 — FDA가 비강 BE 판단에 쓰는 in vitro 자료."}}]}};</script>
<script>
"use strict";
const D = window.NASAL;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// bilingual text: block (two lines) or inline
const T = (o) => (o && typeof o === "object" ? `<span class="en">${o.en}</span>${o.ko && o.ko !== o.en ? `<span class="ko">${o.ko}</span>` : ""}` : o ?? "");
const Ti = (en, ko) => `<span class="en">${en}</span><span class="ko-inline">${ko}</span>`;
const name = (o) => (o.ko && o.ko !== o.en ? `<span class="en">${o.en}</span><span class="ko-inline">${o.ko}</span>` : o.en);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const segHtml = (id, cur, opts) => `<div class="seg" id="${id}" role="group">${opts.map(([v, en, ko]) =>
  `<button type="button" data-v="${v}" aria-pressed="${cur === v}">${Ti(en, ko)}</button>`).join("")}</div>`;

// ── language ────────────────────────────────────────────────────
function setLang(l) {
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l === "ko" ? "ko" : "en";
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === l));
  try { localStorage.setItem("nasal-lang", l); } catch (e) { /* storage unavailable */ }
}
let saved = null; try { saved = localStorage.getItem("nasal-lang"); } catch (e) { /* storage unavailable */ }
setLang(["both", "en", "ko"].includes(saved) ? saved : "both");
$("#lang").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); });
$("#asof").innerHTML = `<span class="en">Data as of </span>${D.asOf}<span class="ko-inline">기준</span>`;

// ═════════ PAGE 1 — COMPETITORS ═════════
const LANE_C = { market: "--lane-1", review: "--lane-2", p3: "--lane-3", p2: "--lane-4", early: "--lane-5", stopped: "--lane-6" };
const ST = {
  COMPLETED: ["done", "Completed", "완료"], RECRUITING: ["go", "Recruiting", "모집 중"], ACTIVE_NOT_RECRUITING: ["go", "Active", "진행 중"],
  NOT_YET_RECRUITING: ["go", "Not yet recruiting", "모집 전"], ENROLLING_BY_INVITATION: ["go", "Enrolling by invitation", "초청 모집"],
  TERMINATED: ["stop", "Terminated", "조기 종료"], WITHDRAWN: ["stop", "Withdrawn", "철회"], SUSPENDED: ["stop", "Suspended", "일시 중지"],
  UNKNOWN: ["unk", "Status unknown", "상태 불명"],
};
let scope = "All", area = "All";

function trialHtml(c) {
  if (!c.trials.length) return `<span class="muted">${T(c.noTrial) || Ti("No registered trial found", "등록 임상 확인 안 됨")}</span>`;
  const shown = c.trials.slice(0, 3);
  return shown.map((t) => {
    const [cls, en, ko] = ST[t.status] || ["unk", t.status, t.status];
    const tip = `${t.phase || ""} · n=${t.n ?? "?"} · primary completion ${t.pcd || "?"} · updated ${t.updated || "?"}`;
    return `<div class="trial" title="${esc(tip)}"><a href="https://clinicaltrials.gov/study/${t.nct}" target="_blank" rel="noopener">${t.nct}</a>
      <span class="st ${cls}">${Ti(en, ko)}</span><span class="meta">${t.phase || ""} · n=${t.n ?? "?"}${t.pcd ? " · " + String(t.pcd).slice(0, 7) : ""}</span>${t.results ? `<span class="res" title="Results posted">✓</span>` : ""}</div>`;
  }).join("") + (c.noTrial ? `<div class="muted" style="font-size:12px">${T(c.noTrial)}</div>` : "");
}

// "New" for cards added in the last 30 days, "Updated" for a card change in the last 14 days (weekly routine writes these)
const daysAgo = (d) => (new Date(D.asOf) - new Date(d)) / 864e5;
function badge(c) {
  if (c.added && daysAgo(c.added) <= 30) return `<span class="fresh new">${Ti("New", "신규")}</span>`;
  const last = (c.history || []).map((h) => h.date).sort().pop();
  return last && daysAgo(last) <= 14 ? `<span class="fresh">${Ti("Updated", "업데이트")}</span>` : "";
}

function card(c) {
  const ar = D.areas.find((a) => a.id === c.area) || { en: c.area, ko: c.area };
  return `<article class="card">
    <div class="card-h"><div><div class="co">${T(c.company)}</div><h3 class="prod">${T(c.product)}</h3></div>
      <span class="flag${c.region === "KR" ? " kr" : ""}" title="${esc(c.region)}">${esc(c.region)}</span></div>
    <div class="api">${T(c.api)}</div>
    <div class="pills"><span class="stage">${Ti(c.stage.en, c.stage.ko)}</span><span class="area">${Ti(ar.en, ar.ko)}</span>${badge(c)}</div>
    <div class="row"><div class="lbl">${T({ en: "For", ko: "적응증" })}</div><div>${T(c.indication)}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Now", ko: "현황" })}</div><div class="now">${T(c.now)}${c.src ? ` <a class="srcl" href="${esc(c.src.url)}" target="_blank" rel="noopener" title="${esc(c.src.label)}">↗</a>` : ""}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Device", ko: "디바이스" })}</div><div class="dev">${T(c.device)}</div></div>
    <div class="row"><div class="lbl">${T({ en: "Trials", ko: "임상" })}</div><div class="trials">${trialHtml(c)}</div></div>
  </article>`;
}

const inScope = (c) => scope === "All" || (scope === "Korea" ? c.region === "KR" : c.region !== "KR");
function renderCompetitors() {
  const el = $("#p-competitors");
  const pool = D.cards.filter(inScope);
  const cards = pool.filter((c) => area === "All" || c.area === area);
  // newest move first; Korean assets first on a tie
  const sorted = (l) => cards.filter((c) => c.lane === l).sort((a, b) => (b.lastMove || "").localeCompare(a.lastMove || "") || (a.region === "KR" ? -1 : 0) - (b.region === "KR" ? -1 : 0));
  const cnt = (ar, l) => pool.filter((c) => c.area === ar && c.lane === l).length;
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 1 · Competitors by development stage", "1페이지 · 개발 단계별 경쟁사")}</div>
      <h1>${T({ en: "Where every nasal product stands now", ko: "비강 제품별 현재 개발 현황" })}</h1>
      <p class="lede">${T({ en: `${D.cards.length} intranasal products across all disease areas (sprays, powders, gels, implants and vaccines), grouped by their most advanced stage. Each card shows the latest move, the delivery device and the trial record on ClinicalTrials.gov.`,
        ko: `질환군과 관계없이 비강 투여 제품 ${D.cards.length}개(스프레이·분말·겔·임플란트·백신)를 최고 개발 단계별로 정리했습니다. 각 카드에 최근 동향, 투여 디바이스, ClinicalTrials.gov 임상 기록을 표시합니다.` })}</p>
      <div class="strip">${D.lanes.map((l) => `<a href="#lane-${l.id}" style="--c:var(${LANE_C[l.id]})"><span class="n">${sorted(l.id).length}</span><span class="l">${T(l.name)}</span></a>`).join("")}</div>
      <div class="mx-wrap"><table class="mx"><thead><tr><th>${T({ en: "Disease area", ko: "질환군" })}</th>${D.lanes.map((l) => `<th>${T(l.name)}</th>`).join("")}<th>${T({ en: "Total", ko: "합계" })}</th></tr></thead><tbody>
        ${D.areas.map((a) => {
          const tot = pool.filter((c) => c.area === a.id).length;
          if (!tot) return "";
          return `<tr class="${area === a.id ? "on" : ""}"><td><button type="button" class="arbtn" data-a="${esc(a.id)}" style="all:unset;cursor:pointer">${Ti(a.en, a.ko)}</button></td>${D.lanes.map((l) => {
            const n = cnt(a.id, l.id);
            return n ? `<td class="c"><button type="button" data-a="${esc(a.id)}" data-l="${l.id}" title="${esc(a.en)} · ${esc(l.name.en)}">${n}</button></td>` : `<td class="z">·</td>`;
          }).join("")}<td class="tot">${tot}</td></tr>`;
        }).join("")}
      </tbody></table></div>
      <div class="toolbar">
        <div class="tools">
          ${segHtml("scope", scope, [["All", "All", "전체"], ["Korea", "Korea", "국내"], ["Global", "Global", "글로벌"]])}
          <select class="sel" id="areaSel" aria-label="Disease area">
            <option value="All">All disease areas · 전체 질환군</option>
            ${D.areas.map((a) => `<option value="${esc(a.id)}"${area === a.id ? " selected" : ""}>${esc(a.en)} · ${esc(a.ko)}</option>`).join("")}
          </select>
        </div>
        <div class="legend"><span>${Ti("Within each stage: most recent move first", "단계 내 정렬: 최근 동향 순")}</span></div>
      </div>
    </div>
    ${D.lanes.map((l) => {
      const list = sorted(l.id);
      const head = `<div class="lane-h"><h2>${Ti(l.name.en, l.name.ko)}</h2><span class="count">${list.length}</span></div>`;
      const body = list.length ? `<div class="cards">${list.map(card).join("")}</div>` : `<div class="empty">${Ti("Nothing at this stage for the current filter", "현재 필터에 해당하는 제품 없음")}</div>`;
      return l.id === "stopped"
        ? `<details class="lane stopped" id="lane-${l.id}" style="--c:var(${LANE_C[l.id]})"><summary>${head}</summary>${body}</details>`
        : `<div class="lane" id="lane-${l.id}" style="--c:var(${LANE_C[l.id]})">${head}${body}</div>`;
    }).join("")}`;
  $("#scope", el).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { scope = b.dataset.v; renderCompetitors(); } });
  $("#areaSel", el).addEventListener("change", (e) => { area = e.target.value; renderCompetitors(); });
  $(".mx", el).addEventListener("click", (e) => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    area = area === b.dataset.a && !b.dataset.l ? "All" : b.dataset.a;
    renderCompetitors();
    const target = b.dataset.l ? document.getElementById(`lane-${b.dataset.l}`) : null;
    if (target) { if (target.tagName === "DETAILS") target.open = true; target.scrollIntoView(); }
  });
}

// ═════════ PAGE 2 — ENDPOINTS ═════════
function renderEndpoints() {
  const el = $("#p-endpoints");
  const E = D.endpoints;
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 2 · Efficacy, PK and PD endpoints", "2페이지 · 유효성·PK·PD 평가변수")}</div>
      <h1>${T(E.title)}</h1>
      <p class="lede">${T(E.lede)}</p>
      <div class="jump">${E.categories.map((c) => `<a href="#cat-${c.key}" data-jump="cat-${c.key}">${Ti(c.name.en, c.name.ko)}</a>`).join("")}</div>
    </div>
    <div class="formula">
      <div class="section-h"><h2>${Ti("Two routes to approval", "허가로 가는 두 가지 경로")}</h2></div>
      <div class="terms">${E.routes.map((r) => `<div class="term"><span class="k">${Ti(r.k.en, r.k.ko)}</span><span class="v">${T(r.v)}</span><span class="d">${T(r.d)}</span></div>`).join("")}</div>
    </div>
    ${E.categories.map((c) => `
    <div class="cat">
      <div class="section-h" id="cat-${c.key}"><div class="cat-h"><h2>${Ti(c.name.en, c.name.ko)}</h2></div></div>
      <div class="tbl-wrap"><table><thead><tr>
        <th>${T({ en: "Product", ko: "제품" })}</th><th>${T({ en: "Pivotal trial", ko: "허가 임상" })}</th><th>${T({ en: "Primary endpoint", ko: "1차 평가변수" })}</th>
        <th>${T({ en: "Key secondary / PD", ko: "주요 2차 / PD" })}</th><th>${T({ en: "Timepoint", ko: "평가 시점" })}</th></tr></thead><tbody>
        ${c.products.map((p) => `<tr><td class="nowrap"><b>${esc(p.product)}</b></td><td>${typeof p.trial === "object" ? T(p.trial) : esc(p.trial || "")}${(p.ncts || []).map((n) => `<br><a class="mono" href="https://clinicaltrials.gov/study/${n}" target="_blank" rel="noopener">${n}</a>`).join("")}</td><td>${T(p.primary)}</td><td>${T(p.secondary)}</td><td>${T(p.timepoint)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="take"><b>${Ti("For a new nasal entrant:", "신규 진입자 시사점:")}</b> ${T(c.takeaway)}</div>
    </div>`).join("")}
    <div>
      <div class="section-h"><h2>${Ti("Nasal-specific safety and device tests", "비강 제형 고유의 안전성·디바이스 시험")}</h2>
        <p>${T({ en: "Measured in almost every nasal program on top of the efficacy endpoint.", ko: "유효성 평가변수와 별도로 거의 모든 비강 개발에서 측정합니다." })}</p></div>
      <ul class="bul">${E.localSafety.map((s) => `<li>${T(s)}</li>`).join("")}</ul>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("Guidance documents", "가이드라인")}</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>${T({ en: "Agency", ko: "기관" })}</th><th>${T({ en: "Document", ko: "문서" })}</th><th>${T({ en: "Why it matters", ko: "의미" })}</th></tr></thead><tbody>
        ${E.guidance.map((g) => `<tr><td class="nowrap"><b>${esc(g.agency)}</b><br><span class="muted mono">${esc(g.year || "")}</span></td><td>${g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>` : esc(g.title)}</td><td>${T(g.why)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <div>
      <div class="section-h"><h2>${Ti("What we should do next", "향후 우리가 할 일")}</h2></div>
      <ol class="todo" style="padding:0;margin:0">${E.todo.map((t) => `<li><b>${T(t.h)}</b><div class="why">${T(t.why)}</div></li>`).join("")}</ol>
    </div>`;
  el.querySelector(".jump").addEventListener("click", (e) => {
    const a = e.target.closest("a[data-jump]"); if (!a) return;
    e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView();
  });
}

// ═════════ PAGE 3 — NEWS ═════════
let nscope = "All", ntype = "All";
const TYPE = { Approval: ["Approval", "승인"], Filing: ["Filing", "허가 신청"], Deal: ["Deal", "계약"], Launch: ["Launch", "출시"], Trial: ["Trial", "임상"],
  Corporate: ["Corporate", "기업"], Device: ["Delivery system", "전달 시스템"], Regulatory: ["Regulatory", "규제"] };
function renderNews() {
  const el = $("#p-news");
  const list = D.news.filter((n) => (nscope === "All" || (nscope === "Korea" ? n.region === "KR" : n.region !== "KR")) && (ntype === "All" || n.type === ntype));
  let html = "", last = "";
  list.forEach((n) => {
    const [y, m] = n.date.split("-");
    const key = `${y}-${m || ""}`;
    if (key !== last) { html += `<div class="month">${m ? Ti(`${MONTHS[+m - 1]} ${y}`, `${y}년 ${+m}월`) : y}</div>`; last = key; }
    const ty = TYPE[n.type] || [n.type, n.type];
    html += `<div class="item"><div class="d">${n.date}</div><div class="t"><div class="tags"><span class="tag${n.region === "KR" ? " kr" : ""}">${n.region === "KR" ? Ti("Korea", "국내") : Ti("Global", "글로벌")}</span><span class="tag${n.type === "Device" ? " dv" : ""}">${Ti(ty[0], ty[1])}</span></div>${T(n.text)}</div>
      <div class="s">${n.src ? `<a href="${esc(n.src.url)}" target="_blank" rel="noopener" title="${esc(n.src.label)}">${Ti("Source", "출처")} ↗</a>` : ""}</div></div>`;
  });
  const types = Object.keys(TYPE).filter((k) => D.news.some((n) => n.type === k));
  el.innerHTML = `
    <div>
      <div class="eyebrow">${Ti("Page 3 · News", "3페이지 · 뉴스")}</div>
      <h1>${T({ en: "Intranasal products and delivery-system news", ko: "비강 제품 및 전달 시스템 뉴스" })}</h1>
      <p class="lede">${T({ en: `${D.news.length} dated events since Jan 2025, newest first, one sentence each. "Delivery system" marks device, platform and nasal-specific regulatory news.`,
        ko: `2025년 1월 이후 날짜별 이벤트 ${D.news.length}건, 최신순, 한 문장 요약. '전달 시스템'은 디바이스·플랫폼·비강 관련 규제 뉴스입니다.` })}</p>
      <div class="toolbar"><div class="tools">${segHtml("nscope", nscope, [["All", "All", "전체"], ["Korea", "Korea", "국내"], ["Global", "Global", "글로벌"]])}
        <select class="sel" id="ntype" aria-label="News type"><option value="All">All types · 전체 유형</option>${types.map((k) => `<option value="${k}"${ntype === k ? " selected" : ""}>${TYPE[k][0]} · ${TYPE[k][1]}</option>`).join("")}</select></div>
        <div class="legend"><span>${list.length} / ${D.news.length}</span></div></div>
    </div>
    <div class="news">${html || `<div class="empty" style="border:0">${Ti("No news for this filter", "해당 뉴스 없음")}</div>`}</div>`;
  $("#nscope", el).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { nscope = b.dataset.v; renderNews(); } });
  $("#ntype", el).addEventListener("change", (e) => { ntype = e.target.value; renderNews(); });
}

// ═════════ ROUTER ═════════
const PAGES = { competitors: renderCompetitors, endpoints: renderEndpoints, news: renderNews };
const done = {};
function show() {
  const h = location.hash.slice(1);
  const page = PAGES[h] ? h : "competitors";
  Object.keys(PAGES).forEach((p) => ($(`#p-${p}`).hidden = p !== page));
  document.querySelectorAll("nav a").forEach((a) => (a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  if (!done[page]) { PAGES[page](); done[page] = true; }
}
addEventListener("hashchange", () => { const h = location.hash.slice(1); show(); if (PAGES[h]) scrollTo({ top: 0 }); });
show();
$("#foot").innerHTML = T({ en: "Sources: ClinicalTrials.gov API, FDA labels and reviews, company filings and trade press. Research current to " + D.asOf + ". Internal use only.",
  ko: "출처: ClinicalTrials.gov API, FDA 라벨 및 심사 자료, 기업 공시 및 업계 언론. " + D.asOf + " 기준 조사. 내부용 자료." });
</script>
</body>
</html>
